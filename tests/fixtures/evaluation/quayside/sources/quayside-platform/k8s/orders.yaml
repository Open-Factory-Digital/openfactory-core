apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: quayside
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: ghcr.io/quayside/quayside-orders:1.4.0
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orders-database
                  key: url
            - name: FREIGHT_ADDR
              value: freight.quayside.svc.cluster.local:50051
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: quayside
spec:
  selector:
    app: orders
  ports:
    - port: 8080
      targetPort: 8080
