# acme/shop — a Django shop. Written by the team; keep the comments.
version: 1
setup:
  - pip install -r requirements.txt
validate:
  test: python manage.py test

# How a preview of this product runs (ADR-0050) — proposed by `openfactory preview propose`;
# the pull request that added it says where each line was read.
preview:
  compose: [.openfactory/preview.compose.yml]
  expose:
    shop: 8000   # inferred · manage.py
  data:
    shop: "python manage.py migrate"   # inferred · manage.py
