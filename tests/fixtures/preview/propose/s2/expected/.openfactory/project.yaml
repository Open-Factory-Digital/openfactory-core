# acme/api — how OpenFactory builds and validates this repository. Kept by the team, and the
# comments are ours: a tool that rewrites this file must leave them where they are.
version: 1
base_branch: main
setup:
  - pip install -r requirements.txt   # the image installs the same
validate:
  test: python -m pytest -q

# How a preview of this product runs (ADR-0050) — proposed by `openfactory preview propose`;
# the pull request that added it says where each line was read.
preview:
  compose: [compose.yaml, .openfactory/preview.compose.yml]
  expose:
    api: 8000   # inferred · compose.yaml:15
    web: 3000   # inferred · compose.yaml:6
