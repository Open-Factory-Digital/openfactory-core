# The product as the team runs it: every service a published image from a private registry.
services:
  web:
    image: ghcr.io/acme/web:latest
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

  api:
    image: ghcr.io/acme/api:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: app
