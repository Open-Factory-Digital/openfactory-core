# .openfactory/product.yaml — how OpenFactory finds this product's requirements.
# Written by `openfactory product init`; safe to edit by hand.
#
# `sources:` must list EVERY repository implementing this product: the product role
# reasons over the whole set, and one missing from it is invisible to it.
preview:
  compose: .openfactory/preview.compose.yml
  expose:
    api: 8000
    web: 3000
product: shop
requirements_dir: requirements
sources:
- acme/api
- acme/web
