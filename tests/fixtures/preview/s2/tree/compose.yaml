# S2: every service runs a published image from a private registry; nothing is built here. Without
# the override beside it, a change to this repository is in no service a preview would run.
services:
  web:
    image: ghcr.io/acme/web:latest
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

  api:
    image: ghcr.io/acme/api:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: app
