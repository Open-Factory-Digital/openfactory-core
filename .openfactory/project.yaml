# .openfactory/project.yaml — this repository's plug into the platform contract.
# The framework knows nothing about this project except what is declared here; the full
# annotated reference is docs/project.yaml.example.
version: 1
base_branch: main

# Autonomy at merge: "human" = bot opens the PR, a human merges; "auto" = merges itself when
# gates are green + review didn't reject + no high-risk component touched.
merge_policy: human

# ADR-0014. planner_stage false (the default) = a single agent plans and implements in one
# pass. review_mode `blocking` is a DEPARTURE from the default `advisory`: a rejected review
# fails the job here — bounded review-repair first, then a human — rather than commenting and
# letting the merge through.
# planner_stage: false
review_mode: blocking

# A VENV INSIDE THE WORKTREE, NEVER THE ONE THE FACTORY ITSELF RUNS ON. The worktree box runs
# these commands on this machine, in the process environment the worker has — so a bare
# `pip install -e .` re-points the RUNNING platform's editable install at a throwaway worktree
# and deletes it with the worktree (measured here, 2026-09-24). `.venv/` is gitignored, so the
# job's `git add -A` never sees it.
setup:
  - "python3 -m venv .venv"
  - ".venv/bin/pip install -q -U pip"
  - ".venv/bin/pip install -e '.[dev]'"

# Mirrors .github/workflows/ci.yml, with the run sealed off from the OPERATOR'S OWN deployment
# (see the `test` gate below for what that means and what was measured).
validate:
  test: |
    # EVERY `OPENFACTORY_*`/`TEMPORAL_*` VARIABLE AND THE REAL HOME, GONE FOR THE RUN. The box
    # runs on this machine in the worker's own environment, and this suite reads both: the
    # operator's `~/.openfactory/` (env file, registry, board) and the deployment's variables —
    # `OPENFACTORY_METRICS_SINK` alone turns 3 message-store tests red, because the factory's
    # own voice then has somewhere real to land. Measured 2026-09-24 on a clean `main`:
    # 81 failed with the operator's HOME, 54 with the variables alone, 0 with neither.
    unset $(env | sed -n "s/^\(OPENFACTORY_[A-Z_]*\|TEMPORAL_[A-Z_]*\)=.*/\1/p" | tr "\n" " ")
    export HOME=$(mktemp -d)
    # …AND THE SINK'S DEFAULT PATH IS RELATIVE (`observability/registry.py`), so unsetting
    # OPENFACTORY_METRICS_DB alone drops an `openfactory-metrics.db` in whatever directory the
    # suite ran in — which, inside a job, is the worktree the ticket's `git add -A` then sweeps.
    export OPENFACTORY_METRICS_DB="$HOME/metrics.db"
    .venv/bin/python -m pytest -q
  lint: ".venv/bin/ruff check openfactory/ tests/"
  security:
    command: ".venv/bin/bandit -r openfactory -ll -q"
    advisory: true
    timeout_minutes: 20

# THE ADRs ARE INDEXED, NOT INLINED, AND THE REASON IS A HARD LIMIT RATHER THAN A PREFERENCE.
# `docs.constraints` inlines every file it matches (each capped at `_MAX_DOC_CHARS`, 8,000 —
# a cap per FILE, with nothing bounding the sum), and this repository has 51 ADRs. The whole
# prompt then travels as ONE argv token: `_cli` builds `claude -p '<prompt>'` and both boxes
# run it through `sh -c`, so Linux's 128 KiB single-argument ceiling (MAX_ARG_STRLEN) applies.
# Measured 2026-09-24 on card #2, the first real ticket on this deployment:
#
#   docs.constraints: docs/adr/**      prompt 367,315 B   sh -c string 369,709 B   E2BIG, job parks
#   docs.architecture: docs/adr/**     prompt  20,557 B   sh -c string  20,899 B   runs
#
# The index gives the agent every ADR's path and title, and the ADRs are in the worktree it is
# already reading — so what changes is WHEN they are read, not whether. Restore them to
# `constraints:` once the prompt stops travelling in the argv (the harness ticket for that is
# open), and `constraints: docs/core/**` is the always-loaded set if one is wanted meanwhile
# (measured at 47,293 B, comfortably inside the ceiling).
docs:
  architecture: docs/adr/**       # path + title per ADR; the agent opens the ones it needs
  # constraints: docs/core/**     # always inlined — keep the SUM under ~128 KiB
  # guidelines: [.openfactory/guidelines/execution.md]

# Declare components only if the repo is polyglot / has risk zones; each maps a diff area to a
# stack (preset) + risk. A risk: high component always stays human-gated, even on auto.
components: {}
  # backend:
  #   path: app/
  #   stack: python
  #   risk: normal
  # infra:
  #   path: terraform/
  #   stack: terraform
  #   risk: high

# Post-merge deploy watch (optional — ADR-0005): observe your repo's CI deploy after merge.
# post_merge_deploy: { workflow: deploy.yml, env: dev, timeout_minutes: 30 }

# No `docs_repo`: the product role is off for this project, and a claim the deployment does not
# authorise is refused rather than followed (`openfactory doctor` reports the disagreement).
