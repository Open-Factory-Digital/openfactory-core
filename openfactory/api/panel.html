  // `null` = the read failed (engine unreachable). `[]` = it succeeded and nothing is waiting.
  // The same rule this codebase pays for on the chat store: an operator reading "nothing needs
  // you" has to be able to trust that it came from a real check, not from a request that failed.
  inbox=Array.isArray(d)?d:null;
  if(viewOwner()==="index")renderIndex();
}
// one line per kind — what to ask, in plain language
function inboxQuestion(it){
  if(it.kind=="decision")return(it.decision&&it.decision.question)||"decision needed";
  if(it.kind=="merge")return"PR ready — waiting on your review"+(it.note?` — ${it.note}`:"");
  if(it.kind=="approval")return"awaiting your production approval";
  if(it.kind=="rate_limit")return"paused — rate limited"+(it.note?` — ${it.note}`:"");
  return it.note||it.state||"needs your attention";
}
// the kicker tag — WHAT KIND of ask this is, at a glance, before the question is even read.
const _INBOX_KICKER={decision:"Decision",merge:"Pull request",approval:"Approval",rate_limit:"Paused"};
function inboxKicker(it){return _INBOX_KICKER[it.kind]||"Needs you"}
// executable buttons per kind — EVERY route here already exists in the action layer (decide /
// mergeGate / actJob / openPromote); this zone adds no capability of its own, only a first place
// to see the question. "Do not invent routes" — the brief this zone was built from, verbatim.
function inboxOptions(it){
  const p=it.project,i=it.issue;
  if(it.kind=="decision")return(it.decision&&it.decision.options||[]).map(o=>
    `<button class="btn sm${o.recommended?"":" ghost"}" title="${esc(o.consequence||"")}" data-act="decide" data-p="${esc(p)}" data-i="${esc(i)}" data-k="${esc(o.key)}">${esc(o.key)} · ${esc(o.label)}</button>`).join(" ");
  // three tiers, not two: MERGE decides, ADJUST redirects, DISCARD ends — a plain-text button
  // for the one action that stops something is the same distinction the site's own copy draws.
  //
  // WHICH ANSWERS EXIST IS THE SERVER'S TO SAY (#164, and #181 is why it matters here). The
  // fourth one — re-review — is offered only where the job knows it is real: review was on, a
  // reviewer has spoken, the cap is not spent. A list kept by hand on this page is the shape that
  // had already lost two states; the tiers below are styling, which is this page's own business.
  if(it.kind=="merge"){
    const TIER={merge:"",adjust:" ghost",review:" ghost",discard:" plain"};
    const opts=(it.options&&it.options.length)?it.options:[
      {key:"merge",label:"Merge"},{key:"adjust",label:"Adjust"},{key:"discard",label:"Discard"}];
    return opts.map(o=>`<button class="btn sm${TIER[o.key]!==undefined?TIER[o.key]:" ghost"}"`+
      ` title="${esc(o.consequence||"")}" data-act="mergeGate" data-p="${esc(p)}"`+
      ` data-i="${esc(i)}" data-k="${esc(o.key)}">${esc(o.label||o.key)}</button>`).join(" ");
  }
  if(it.kind=="approval")return`<button class="btn sm" data-act="openPromote" data-p="${esc(p)}" data-i="${esc(i)}">Review &amp; promote</button>`;
  if(it.kind=="rate_limit")return`<button class="btn sm" data-act="actJob" data-p="${esc(p)}" data-i="${esc(i)}" data-k="resume">Retry now</button> `+
    `<button class="btn sm ghost" data-act="actJob" data-p="${esc(p)}" data-i="${esc(i)}" data-k="skip">Skip</button>`;
  return(it.options||[]).map(o=>
    `<button class="btn sm${o.key=="resume"?"":" ghost"}" data-act="actJob" data-p="${esc(p)}" data-i="${esc(i)}" data-k="${esc(o.key)}">${esc(o.label)}</button>`).join(" ");
}
// WHAT THIS PLATFORM'S OWN REVIEWER FOUND, beside the buttons that act on it (#149). It was
// computed at the REVIEW station and shown nowhere near the gate, so a pull request the review
// REJECTED and one it approved were the same pixels — the pilot found out by asking in words, and
// only after saying "you can merge". The server decides the level and the words (`review/verdict`);
// this paints them, and derives nothing.
function reviewHtml(r){
  if(!r||!r.word)return"";
  const tone={ok:"b-ok",warn:"b-warn",unknown:"b-dim"}[r.level]||"b-dim";
  const pts=(r.points||[]).map(p=>`<li>${esc(p)}</li>`).join("");
  return `<div class="needs-review">
    <span class="pill ${tone}">${esc(r.word)}</span>
    <span class="rv-clause">${esc(r.clause||"")}</span>
    ${pts?`<ul class="rv-points">${pts}</ul>`:""}
  </div>`;
}
function inboxRow(it,idx){
  return `<article class="needs-card">
    <span class="needs-num">${String(idx+1).padStart(2,"0")}</span>
    <div class="needs-body">
      <span class="needs-kicker">${esc(inboxKicker(it))}</span>
      <div class="needs-title">#${esc(it.issue)} <span class="sep">·</span> ${esc(it.project)}${it.title?` <span class="sep">·</span> ${esc(it.title)}`:""}</div>
      <p class="needs-sub">${esc(inboxQuestion(it))}</p>
      ${reviewHtml(it.review)}
    </div>
    <div class="needs-actions">${inboxOptions(it)}</div>
  </article>`;
}
// EMPTY IS ONE QUIET LINE IN THE SAME COMPONENT, never a blank region — a zone that disappears
// when empty teaches nobody where to look, so the day it is not empty nobody has seen it before.
// `null` (could not read) reads differently from `[]` (checked, genuinely clean) for the same
// reason the chat store distinguishes them: silence must never be mistaken for an answer.
function needsYouHtml(items){
  const cnt=items&&items.length?`<span class="cnt">${items.length}</span>`:"";
  const body=items===null
    ?`<div class="empty" style="padding:18px">could not check what needs you — the engine may be unreachable</div>`
    :items.length?`<div class="needs-list">${items.map((it,idx)=>inboxRow(it,idx)).join("")}</div>`
    :`<div class="empty" style="padding:18px">nothing needs you</div>`;
  return `<div class="sechead"><span class="lbl">Needs you</span>${cnt}<span class="rule"></span></div>
    ${body}`;
}
// THE LOG'S OWN ADDRESS. It was a modal, which was the smallest thing that could close the "the
// Logs button leads nowhere" gap and is the wrong shape for the job: a run's log is what an
// operator READS — scrolling, searching, comparing one run against another — and a box in the
// middle of the floor gives them a quarter of the screen and no way to link to what they found
// (pilot, 2026-08-15: "shouldn't this be a bigger screen of its own, with filters and so on?").
function curLogs(){
  const m=location.pathname.match(/^\/logs(?:\/([^/]+))?(?:\/([^/]+))?/);
  return m?{project:m[1]?decodeURIComponent(m[1]):"",issue:m[2]?decodeURIComponent(m[2]):""}:null;
}

// WHICH VIEW OWNS THE SCREEN — and a background updater may only repaint the one it is FOR.
// The engine tick, the inbox read and the project-list push all called `renderIndex()` whenever
// `curProject()` was null, which is true of EVERY page that is not a project's floor. So the
// index painted itself over the Logs page a few seconds after it opened — and over the product
// surface too — with the URL still saying where the operator thought they were (pilot,
// 2026-08-15: "I open a project's logs and it goes back to the home page… without me doing anything").
function viewOwner(){
  if(curProduct()!==null)return "product";
  if(curLogs())return "logs";
  return curProject()?"project":"index";
}
function render(){
  if(es){es.close();es=null;focus=null}
  loadFloor();   // a different scope is a different question
  // THE MACHINE CARD'S REDRAW KEY BELONGS TO A VIEW, NOT TO THE SESSION (#139). `refreshProject`
  // skips re-rendering `#active` when the running-job set is unchanged, so the live log feed is
  // not wiped on every frame. But the key outlived navigation while `#active` was recreated
  // EMPTY by the line below — so leaving a project with a running job and coming back while the
  // same job ran produced an identical key, the redraw was skipped, and the card stayed blank
  // for as long as that job lasted. Cleared here, where a view is torn down.
  window._machineKey=null;
  if(curProduct()!==null){renderProduct(curProduct());return}
  if(curLogs()){renderLogsPage();return}
  curProject()?renderProject(curProject()):renderIndex();
}

// THE BOX, MADE VISIBLE. Until this existed every one of the 41 occurrences of "box" in this
// file was CSS: the state that decides whether a factory picks up work at all had a file on disk,
// a gate in the poller and no window anywhere. For a product built on unattended runs that is the one
// thing a client asks to see — so it sits on the project card, beside the enabled switch, because
// "the poller includes this project" and "the poller will refuse every card anyway" are one answer
// and a panel that splits them shows a green project over a dead queue.
//
// FOUR STATES, and `unknown` is not `unproven`: one is a fact about the client's box, the other is
// our inability to read it, and collapsing them is this codebase's most expensive defect class.
function boxChip(b){
  if(!b) return "";
  const look={proven:["ok","box proven"],expired:["warn","box expired"],
              unproven:["err","box unproven"],unknown:["dim","box unknown"]}[b.state]||["dim","box ?"];
  const when=b.at?` · ${esc(String(b.at).slice(0,16).replace("T"," "))}`:"";
  const why=b.detail?esc(b.detail):(b.image?`${esc(b.image)}${when}`:"");
  return `<span class="chip ${look[0]}" title="${why}">${look[1]}</span>`;
}

// --- index: the projects ---------------------------------------------------
function renderIndex(){
  // EVERY CARD'S VERDICT RIDES THE ONE ANSWER (#144). This ran the ladder per card, in the
  // browser; the platform now decides all of them in a single walk and the census is counted from
  // exactly those, so a card and the header cannot disagree about the project under it.
  //
  // Before #141 this card had its own held/running/idle triple, stated THREE times over — and it
  // never once looked at `p.enabled`, so a project with pickup off read "Idle" here and "Pickup is
  // OFF" on its own page; it also counted a PARKED job as running.
  const per=(_floor&&_floor.per_project)||{};
  const cards=(projects||[]).map(p=>{
    const fs=per[p.name]||{level:"unknown",short:"Unknown",cause:"unread",
                           clause:"this page has not been told about this project yet"};
    const badge={ok:"st-idle",clock:"st-idle",warn:"st-running",err:"st-held",
                 unknown:"st-idle"}[fs.level]||"st-idle";
    const edge={err:"held",warn:"busy",ok:fs.cause==="running"?"busy":""}[fs.level]||"";
    return `<div class="proj ${edge}" data-act="go" data-to="/p/${encodeURIComponent(p.name)}">
      <div class="top">
        <div class="ic">${esc(p.name.slice(0,2).toUpperCase())}</div>
        <div style="flex:1"><h3>${esc(p.name)}</h3>
          <div class="chips">${boxChip(p.box)}<span class="chip">${esc(p.tracker)}</span><span class="chip">${esc(p.forge)}</span>${p.board?`<span class="chip">board ${esc(String(p.board))}</span>`:""}</div></div>
        <span class="proj-status ${badge}"><span class="dot"></span>${esc(fs.short)}</span>
      </div>
      <div class="stat">
        <div class="grow sub" title="${esc(fs.detail||fs.clause)}">${esc(fs.clause)}</div>
        <div class="sw ${p.enabled?"on":""}" title="${p.enabled?"enabled — pulls TO-DO on its own":"disabled"}" onclick="event.stopPropagation();toggleProject('${esc(p.name)}',${!p.enabled})"></div>
      </div></div>`}).join("");
  $("#app").innerHTML=`
    ${needsYouHtml(inbox)}
    <div class="sechead"><span class="lbl">Projects</span><span class="rule"></span>
      <button class="btn ghost sm" onclick="openRegister()">＋ New project</button></div>
    <div class="grid">${cards||(projects===null
      ? `<div class="empty"><div class="big">?</div>the project list could not be read — this is not evidence that there are none</div>`
      : `<div class="empty"><div class="big">◭</div>no projects yet — register the first one</div>`)}</div>`;
}

// ── THE PRODUCT ROLE'S SURFACE (#98) ──────────────────────────────────────────────────────────
//
// ADR-0038 says the panel is the reference surface and a channel is a transport; ADR-0040 records
// the product owner settling where this role belongs: *"the product role is available ON THE
// PLATFORM, not in Slack"*. Both were true as decisions and false as code — 2,165 lines of the
// role's behaviour lived in the Slack package and NOTHING here mentioned it.
//
// EVERY BUTTON BELOW IS A MAPPING. The panel gains no capability of its own: each one POSTs to
// `/api/act/<row>`, the same rows `openfactory product` and the channel reach (ADR-0039). If a verb is
// missing from this page it is missing from the catalogue, which is the honest place for it to be
// missing from.
let _prod={project:"",status:null,reqs:null,thread:[],draft:null,busy:false,room:true,timer:null};

async function bootProduct(){
  // THE FLOOR'S OWN CHROME COMES OFF, and looking at the page is what found this: the status
  // banner sat on "floor…" for ever, because `paintFloor` only runs on engine data this
  // credential is refused — a permanent placeholder about a thing this person is deliberately
  // not shown. The cost pill goes for the same reason: `/api/metrics` is a floor read, so the
  // button existed only to produce a 403. A green suite could not have seen either.
  const floor=$("#floor"); if(floor)floor.style.display="none";
  const costs=$("#costs"); if(costs)costs.style.display="none";
  // NO FLOOR READS AT ALL on this path — a product credential is refused every one of them, and
  // firing them anyway would fill the console with 403s and the screen with nothing.
  let name=curProduct();
  if(!name){
    const list=await api("/api/product/projects").catch(()=>[]);
    name=(Array.isArray(list)&&list.length===1)?list[0].name:"";
    if(name)history.replaceState({},"","/product/"+encodeURIComponent(name));
  }
  _prod.project=name||"";
  renderProduct(_prod.project);
  if(_prod.project){
    try{_prod.room=localStorage.getItem("of.prod.room")!=="0"}catch(e){}
    paintScope();loadProductStatus();loadRequirements();loadThread();watchRoom()}
}

async function loadProductStatus(){
  _prod.status=await act("product_status",{project:_prod.project}).catch(()=>null);
  paintProductHead();
}
async function loadRequirements(){
  const out=await act("product_requirements",{project:_prod.project}).catch(()=>null);
  // `null` = the read failed; `[]` = read it, and this client has written nothing yet. The rule
  // this codebase pays for everywhere: silence must never be mistaken for an answer.
  _prod.reqs=(out&&out.ok&&out.data&&Array.isArray(out.data.requirements))?out.data.requirements:null;
  paintRequirements();
}

// One POST, one Outcome. `ok` and `message` are the action layer's own words — never re-written
// here, because `product/voice.py` exists precisely so a client reads a sentence somebody wrote.
async function act(name,params){
  const r=await mfetch("/api/act/"+encodeURIComponent(name),{method:"POST",
    headers:{"content-type":"application/json"},body:JSON.stringify({params})});
  const d=await r.json().catch(()=>({}));
  return {ok:r.ok&&d.ok!==false,message:d.message||d.detail||"",data:d.data||{},status:r.status};
}

function paintProductHead(){
  const el=$("#prodHead");if(!el)return;
  const s=_prod.status;
  if(!s){el.innerHTML="";return}
  // The corpus's own sentence, not a badge invented here.
  el.innerHTML=`<div class="row"><div class="grow"><b style="color:var(--txt)">${esc(s.message||"")}</b></div></div>`;
}

function paintRequirements(){
  const el=$("#prodReqs");if(!el)return;
  const cnt=$("#prodCount");
  if(_prod.reqs===null){
    if(cnt)cnt.textContent="";
    el.innerHTML=`<div class="empty" style="padding:18px">could not read the requirements — the
      documentation repository may need a credential</div>`;return;
  }
  if(cnt)cnt.textContent=String(_prod.reqs.length);
  if(!_prod.reqs.length){
    el.innerHTML=`<div class="empty" style="padding:18px">nothing written yet</div>`;return;
  }
  // ACCEPT AND DROP ARE CLICKED, NEVER TYPED. Both rows take a NUMBER, and before this list
  // existed the only instruction possible was "type a number you got from somewhere else" —
  // which is how a client accepts the wrong requirement.
  el.innerHTML=_prod.reqs.map(r=>{
    const st=String(r.status||"");
    const cls=st==="accepted"?"ok":st==="observed"?"warn":"dim";
    const acts=st==="accepted"?"":
      `<button class="btn sm" data-act="acceptRequirement" data-n="${esc(r.number)}">Accept</button>
       <button class="btn sm plain" data-act="dropRequirement" data-n="${esc(r.number)}">Drop</button>`;
    return `<div class="row">
      <span class="tk">${r.number}</span>
      <div class="grow"><b style="color:var(--txt)">${esc(r.title||r.slug||"")}</b>
        <div class="sub">${esc(st)}${r.asked_by?` · asked by ${esc(r.asked_by)}`:""}${r.date?` · ${esc(r.date)}`:""}</div></div>
      <span class="chip ${cls}">${esc(st||"?")}</span>
      <div style="display:flex;gap:8px">${acts}</div></div>`;
  }).join("");
}

function paintThread(){
  const el=$("#prodThread");if(!el)return;
  el.innerHTML=_prod.thread.map(m=>{
    // A DRAFT IS A THING TO SIGN OFF, so it gets the buttons beside the words that were read —
    // `product_propose` refuses to re-derive the text, and this is the text it will commit.
    const sign=m.canPropose
      ? `<div class="needs-actions" style="margin-top:12px">
           <button class="btn sm" onclick="proposeDraft()">Propose as requirement</button>
           <button class="btn sm ghost" onclick="dismissDraft()">Not yet</button></div>`
      : "";
    return `<article class="needs-card" style="display:block"><div class="needs-body" style="flex:1 1 auto">
      <span class="needs-kicker">${esc(m.kind||"Product")}</span>
      <div style="white-space:pre-wrap">${esc(m.text||"")}</div>${sign}</div></article>`;
  }).join("");
}

// ONE HELPER FOR THE READING ROWS, because four copies of "disable, call, push, repaint" is how
// three of them end up without the busy state and nobody notices — the shape this codebase keeps
// paying for. Every one of them reads and reports; none writes.
async function prodLook(row,label,params){
  const btn=event&&event.target;if(_prod.busy)return;
  _prod.busy=true;const was=btn?btn.textContent:"";
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> reading…'}
  _prod.thread.push({kind:"You",text:label,local:true});paintThread();
  // TRY/FINALLY, BECAUSE A REJECTED FETCH USED TO KILL THE WHOLE PAGE. `act` awaits a POST; a
  // dropped connection rejects it, the function threw before restoring `_prod.busy`, and every
  // button on the surface stayed disabled behind a spinner that never stopped — the client's only
  // remedy was a reload they had no reason to try.
  let out;
  try{
    out=await act(row,Object.assign({project:_prod.project},params||{}));
  }catch(e){
    out={ok:false,message:"the connection dropped before it answered — nothing was lost, try again."};
  }finally{
    _prod.busy=false;if(btn){btn.disabled=false;btn.textContent=was}
  }
  // A ROW THAT ANSWERED WITH NOTHING STILL GETS A LINE. Silence here is indistinguishable from a
  // button that does not work, which is the failure this whole surface exists to remove.
  _prod.thread.push({kind:out.ok?label:"Refused",local:true,
                     text:out.message||(out.ok?"nothing to report.":"it did not say why.")});
  paintThread();
}

async function askProduct(){
  const box=$("#prodAsk"),btn=$("#prodAskBtn");
  const q=((box&&box.value)||"").trim();if(!q||_prod.busy)return;
  _prod.busy=true;if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> reading…'}
  _prod.thread.push({kind:"You",text:q});paintThread();
  const out=await act("product_ask",Object.assign({project:_prod.project,question:q},_scopeParam()));
  _prod.busy=false;if(btn){btn.disabled=false;btn.textContent="Ask"}
  if(box)box.value="";
  // THE ANSWER TRAVELS so `product_propose` can commit exactly the text that was read — a second
  // draft from the same words is a different text, which is the one thing that row refuses.
  _prod.draft=(out.ok&&out.data&&out.data.proposes_a_requirement)?out.data.answer:null;
  _prod.thread.push({kind:out.ok?"Product":"Refused",text:out.message,canPropose:!!_prod.draft});
  paintThread();
}

async function proposeDraft(){
  if(!_prod.draft)return;
  const out=await act("product_propose",{project:_prod.project,answer:_prod.draft,yes:true});
  toast("Propose",out.message||(out.ok?"proposed":"refused"),out.ok?"ok":"err");
  if(out.ok){_prod.draft=null;_prod.thread.forEach(m=>{m.canPropose=false});paintThread();loadRequirements()}
}
function dismissDraft(){_prod.draft=null;_prod.thread.forEach(m=>{m.canPropose=false});paintThread()}

// THE ROOM'S KEY IS THE PROJECT'S NAME — the conversation every transport without a per-person
// key always had, and the one the worker resolves an empty thread to. "Just me" names nothing,
// and the server keys it by who this browser is (`_conversation_of`): a key the page never sees
// and could not forge for somebody else, because `product/conversation.py` refuses any private
// key that is not the caller's own. One helper, so the turn and the read cannot land in
// different conversations.
function _scopeParam(){return _prod.room?{thread:_prod.project}:{}}
function paintScope(){
  const r=$("#scopeRoom"),m=$("#scopeMine"),n=$("#scopeNote");if(!r||!m)return;
  r.classList.toggle("ghost",!_prod.room);m.classList.toggle("ghost",_prod.room);
  if(n)n.textContent=_prod.room
    ?"everybody on the project reads and writes here — like the channel"
    :"one person's alone — what you say here nobody else can reach";
}
function setScope(room){
  if(_prod.room===room)return;
  _prod.room=room;try{localStorage.setItem("of.prod.room",room?"1":"0")}catch(e){}
  _prod.thread=[];_prod.draft=null;paintScope();paintThread();loadThread();
}
// THE STORE IS THE CONVERSATION and the page is a view of it: reload, and what the role still
// remembers is on the screen; sit in the room, and what the others said arrives. Two things the
// store cannot repaint stay: a draft this person has not yet signed off (its buttons live here,
// so nothing is redrawn while one waits) and the reading rows' reports, which were never in it.
async function loadThread(){
  if(!_prod.project||!$("#prodThread")||_prod.draft)return;
  let out;try{out=await act("product_thread",Object.assign({project:_prod.project},_scopeParam()))}catch(e){return}
  if(!out||!out.ok||!out.data||!Array.isArray(out.data.turns))return;
  const kept=_prod.thread.filter(m=>m.local);
  _prod.thread=out.data.turns.map(t=>({kind:t.role==="agent"?"Product":(_prod.room?(t.actor||"Somebody"):"You"),
                                       text:t.text})).concat(kept);
  paintThread();
}
function watchRoom(){
  if(_prod.timer)clearInterval(_prod.timer);
  _prod.timer=setInterval(()=>{if(_prod.room)loadThread()},_CHAT_TICK*2);
}

async function acceptRequirement(number){
  if(!confirm(`Accept requirement ${number}?\n\nAfter this the factory argues FROM it, and work is filed onto the board.`))return;
  const out=await act("product_accept",{project:_prod.project,number:String(number),yes:true});
  toast("Accept",out.message||(out.ok?"accepted":"refused"),out.ok?"ok":"err");
  loadRequirements();
}
async function dropRequirement(number){
  const why=prompt(`Drop requirement ${number}? The reason is recorded beside it.`)||"";
  if(!why.trim())return;
  const out=await act("product_drop",{project:_prod.project,number:String(number),reason:why,yes:true});
  toast("Drop",out.message||(out.ok?"dropped":"refused"),out.ok?"ok":"err");
  loadRequirements();
}

// ── THE TECH-LEAD CHAT — one conversation, both directions (ADR-0038) ─────────────────────
// The standard floating widget the product owner asked for. TWO sources render into ONE thread:
//  · the platform speaking FIRST — pickups, parks, "needs you" questions WITH their executable
//    option buttons (the C-25 message store; Slack is just another transport of the same voice)
//  · the human asking — free text dispatched to the worker's tech-lead (AskWorkflow)
// The fab badge counts questions waiting on a human, so an impediment is never a silent state.
let _chatProject=null,_chatLocal=[],_chatTimer=null,_staged=null;
// Why a suggestion is shown but not offered. The reasons come from the server (`messages.staged`);
// this only turns each into a sentence, because a button that silently stops working teaches the
// same wrong lesson as one that vanishes on a refresh.
const _RETIRED={answered:"already carried out",
                expired:"expired — ask again so the tech-lead looks at the floor as it is now"};
function mountChat(name){
  _chatProject=name;_chatLocal=[];
  document.querySelectorAll(".chatfab,.chatpanel").forEach(e=>e.remove());
  document.body.insertAdjacentHTML("beforeend",`
    <button class="chatfab" id="chatFab" onclick="toggleChat()" title="talk to the tech-lead">TL</button>
    <div class="chatpanel" id="chatPanel">
      <div class="chathead">
        <b>Tech-lead · ${esc(name)}</b>
        <span class="sub grow">responde lendo o repositório e o estado da fábrica</span>
        <button class="btn sm ghost" onclick="toggleChat()">✕</button>
      </div>
      <div class="chatlog" id="chatLog"></div>
      <div class="chatin">
        <input id="askInput" placeholder="ask something, or answer what it asked above…"
          onkeydown="if(event.key==='Enter')askTechlead()">
        <button class="btn sm" id="askBtn" onclick="askTechlead()">Send</button>
      </div>
    </div>`);
  refreshChat();
  streamWatch(_chatProject);       // ask the socket for THIS project's conversation
  if(_chatTimer)clearInterval(_chatTimer);
  // NEVER REMOVED, ONLY SKIPPED. While the socket is healthy `chatShouldFetch` lets one tick in
  // four through — a belt-and-braces floor at a minute; the moment it is not, every tick fetches
  // and the conversation keeps moving without anybody noticing the transport changed.
  _chatTimer=setInterval(()=>{if(chatShouldFetch())refreshChat()},_CHAT_TICK);
}
function toggleChat(){
  const p=$("#chatPanel");p.classList.toggle("open");
  if(p.classList.contains("open")){const l=$("#chatLog");l.scrollTop=l.scrollHeight;$("#askInput").focus()}
}
async function refreshChat(){
  if(!_chatProject||!$("#chatLog"))return;
  let d;try{d=await api("/api/messages/"+encodeURIComponent(_chatProject))}catch(e){return}
  paintChat(d);
}

// FETCHING AND PAINTING ARE TWO THINGS, and they were one function until the socket arrived.
// The stream already HAS the payload — pushing it through a re-fetch would spend a request to
// re-read what just arrived, and worse, would make the live path silently depend on the polling
// path still working.
function paintChat(d){
  if(!_chatProject||!$("#chatLog"))return;
  const pending=d.pending||[];
  const said=(d.messages||[]).filter(m=>m.kind=="said"||m.kind=="answered"||m.kind=="told");
  const server=[...said.map(m=>({t:m.kind=="told"?"me":"tl",text:m.text,ts:m.ts,token:m.token})),
                ...pending.map(q=>({t:"ask",text:q.text,ts:q.ts,token:q.token,options:q.options||[]}))]
    .sort((a,b)=>String(a.ts||"").localeCompare(String(b.ts||"")));
  // ONE THREAD, ONE CLOCK (#123). This was `[...server, ..._chatLocal]` — every persisted message
  // first, then whatever this tab remembered — so a narration that arrived AFTER a typed question
  // was drawn above it, and the pilot quite reasonably called the order "estranha". Both halves
  // now carry a `ts` from the store, so the merge is by time; `_chatLocal` keeps only what has no
  // server row YET (the in-flight "…" placeholder, and a turn whose write we could not confirm),
  // and anything the store has already echoed back is dropped rather than shown twice.
  const echoed=new Set(said.map(m=>String(m.text||"").trim()));
  const local=_chatLocal.filter(m=>m.t=="wait"||!echoed.has(String(m.text||"").trim()));
  const items=[...server,...local];
  // THE STAGED SUGGESTION COMES FROM THE STORE (#123). It used to be a field on whichever local
  // message this tab happened to have produced, so a refresh — or a second screen, or a
  // colleague — lost a decision the platform was waiting on. The server decides whether it is
  // still pressable (superseded / answered / expired); re-deciding that here could only disagree.
  _staged=d.suggestion||null;
  const log=$("#chatLog");const stick=log.scrollHeight-log.scrollTop-log.clientHeight<60;
  log.innerHTML=items.map(m=>{
    if(m.t==="me")return `<div class="msg me">${esc(m.text)}</div>`;
    if(m.t==="wait")return `<div class="msg tl" id="${m.id}"><span class="sub">the tech-lead is reading the repository… (1–3 min)</span></div>`;
    if(m.t==="ask")return `<div class="msg tl"><b>${esc(m.text)}</b>
        <div class="opts">${m.options.map(o=>`<button class="btn sm ${o.key=="approve"?"":"ghost"}"
          data-act="answerQuestion" data-p="${esc(_chatProject)}" data-tok="${esc(m.token)}" data-k="${esc(o.key)}">${esc(o.label)}</button>`).join("")}</div>
        <div class="sub">${esc((m.ts||"").slice(0,16).replace("T"," "))} · waiting for you</div></div>`;
    // A SUGGESTION IS A BUTTON, never dead text — "human decides, factory acts" needs a
    // thing to CLICK.
    //
    // NO VERB LIST HERE (#121). This read `["resume","skip"].includes(...)` — a second copy of a
    // vocabulary that lives in the action catalogue, and it went stale the moment #120 gave the
    // tech-lead a merge row: the answer said "quer que eu faça o merge?" and rendered as grey
    // text with nothing to press. The verb was already decided by the asker's own credential
    // before it got here (actions.proposable), and the gate is applied where it is executed.
    //
    // AND IT HANGS OFF THE STORE'S OWN ROW (#123), matched by token, so it is on the message the
    // tech-lead actually proposed it in — on every screen, after every refresh.
    let sg="";
    if(_staged&&m.token&&_staged.token===m.token){
      // WHAT THE BUTTON WILL DO, ABOVE THE BUTTON (#170). A proposal can now carry an
      // instruction — free text the tech-lead composed inside a loop that has read the client's
      // own ticket comments — and pressing `▶ adjust #87` without seeing it is approving a blank
      // cheque. The server sends `params`; this paints them and decides nothing.
      // The label comes from the server (#172): the catalogue knows what an `instruction`
      // is and this page must not have a second opinion. `||k` when it does not say.
      const lbl=_staged.labels||{};
      const detail=Object.entries(_staged.params||{})
        .map(([k,v])=>`<div class="sg-param"><b>${esc(k)}:</b> ${esc(v)}`
          +`${lbl[k]?`<div class="sub">${esc(lbl[k])}</div>`:""}</div>`).join("");
      sg=_staged.live
        ? `<div class="opts">${detail}<button class="btn sm" data-act="approveSuggestion" data-tok="${esc(_staged.token)}">▶ ${esc(_staged.action)} #${esc(_staged.issue)}</button></div>`
        : `<div class="sub">${esc(_RETIRED[_staged.reason]||("sugestão encerrada ("+_staged.reason+")"))}</div>`;
    }
    return `<div class="msg tl">${esc(m.text)}${sg}${m.sub?`<div class="sub">${m.sub}</div>`:""}
        ${m.ts?`<div class="sub">${esc((m.ts||"").slice(0,16).replace("T"," "))}</div>`:""}</div>`;
  }).join("");
  if(stick)log.scrollTop=log.scrollHeight;
  const fab=$("#chatFab");if(!fab)return;
  const n=pending.length;
  fab.innerHTML=`TL${n?`<span class="badge">${n}</span>`:""}`;
}
// APPROVING IS ITS OWN GESTURE, addressed by TOKEN (#123). This used to post to /api/act/<verb>
// with a verb remembered in a JavaScript array: the approval was an unattached action, the thread
// kept no record that a decision had been made, and a refresh in between lost the proposal. The
// route below performs it through the same action layer with the credential that PRESSED it, and
// records the decision — so the button retires by itself, on every screen.
//
// The outcome is not pushed into _chatLocal: the route writes it to the thread, and refreshChat
// brings it back with a timestamp from the same clock as everything else.
async function approveSuggestion(btn,token){
  btn.disabled=true;btn.textContent="executando…";
  try{
    const r=await mfetch(`/api/messages/${encodeURIComponent(_chatProject)}/suggestion`,{
      method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({token})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)_chatLocal.push({t:"tl",text:d.detail||d.message||"recusado"});
  }catch(e){_chatLocal.push({t:"tl",text:"I could not run that — the panel did not reach the worker"})}
  await refreshChat();
}

async function askTechlead(){
  const input=$("#askInput"),btn=$("#askBtn");
  const q=(input.value||"").trim();if(!q)return;
  input.value="";btn.disabled=true;
  const id="w"+Date.now();
  _chatLocal.push({t:"me",text:q});_chatLocal.push({t:"wait",id});
  await refreshChat();
  try{
    const r=await mfetch("/api/act/ask",{method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({params:{project:_chatProject,question:q}})});
    const d=await r.json().catch(()=>({}));
    const i=_chatLocal.findIndex(m=>m.id===id);
    if(d.ok){
      // NO SUGGESTION CARRIED HERE ANY MORE (#123). It is on the stored row, keyed by token, and
      // refreshChat() below brings it back with the answer — so what this tab shows is what the
      // next tab, the next refresh and the next person show.
      _chatLocal[i]={t:"tl",text:d.message||""};
    }else{_chatLocal[i]={t:"tl",text:d.detail||d.message||("falhou ("+r.status+")")}}
  }catch(e){
    const i=_chatLocal.findIndex(m=>m.id===id);
    if(i>=0)_chatLocal[i]={t:"tl",text:"no answer — the panel did not reach the worker"};
  }finally{btn.disabled=false;await refreshChat()}
}

async function answerQuestion(project,token,answer){
  try{
    const r=await mfetch(`/api/messages/${encodeURIComponent(project)}/answer`,
      {method:"POST",headers:{"content-type":"application/json"},
       body:JSON.stringify({token,answer})});
    const d=await r.json().catch(()=>({}));
    // The refusal is SHOWN, never swallowed. A 409 means somebody already answered this — on
    // another tab or another person's screen — and a green toast over it would tell this reader
    // they decided something they did not.
    if(r.ok)toast("Answered",(d&&d.message)||(answer=="approve"?"approved":"rejected"),"ok");
    else toast("Not recorded",(d&&d.detail)||"that question is no longer open","err");
  }catch(e){toast("Error","could not send the answer","err")}
  refreshChat();
}

async function loadCockpit(name){
  // `null` UNTIL SOMEBODY ANSWERS, and it stays null when the read fails (#134). The floor card
  // renders that as its own sentence rather than as "armed": a project whose pickup we could not
  // check is not a project the screen may promise work from.
  //
  // KEYED BY PROJECT (#141), because it used to be one global for "the project you are looking
  // at" — so it was worthless to the index, where every card needs its own answer, and a stale
  // value from the previous project could be read during the moment before this one replaced it.
  window._pickup=window._pickup||{};
  window._pickup[name]=null;
  let f; try{f=await api("/api/factory/"+encodeURIComponent(name))}catch(e){refreshProject();return}
  window._pickup[name]=(f.pickup_enabled===undefined)?null:f.pickup_enabled;
  refreshProject();   // the floor card is drawn from this; without it the truth waits 20s
  const box=$("#cockpit"); if(!box)return;
  applyPipelineShape(f.single_agent!==false);  // ADR-0014: drop the Plan station for single-agent
  const t=f.tokens||{count:0}, L=f.links||{};
  const dots="●".repeat(Math.max(1,t.count||0));
  // Per ROLE, and only the roles that DIFFER — a deployment running one model everywhere should
  // read as one line, but the moment a client puts the executor on a frontier model and the
  // tech-lead on a cheap one, the cockpit has to show both or it is hiding the decision.
  const M=f.models||{}, exec=M.executor||"?";
  const others=Object.entries(M).filter(([r,v])=>r!=="executor"&&v&&v!==exec);
  const modelsHtml=(f.single_agent!==false||!M.planner||M.planner===exec)
    ? `agent <span style="color:var(--amber)">${esc(exec)}</span>`
      + (others.length?` · ${others.map(([r,v])=>`${esc(r)} <span style="color:var(--cyan)">${esc(v)}</span>`).join(" · ")}`:"")
    : `plan <span style="color:var(--cyan)">${esc(M.planner)}</span> · exec <span style="color:var(--amber)">${esc(exec)}</span>`;
  // A button is either a place you can go or a sentence saying where the thing IS. What it may
  // never be is a dead word: the local deployment rendered "Logs" greyed out beside a factory
  // that writes a journal for every job, and the operator read that as "no logs here" (pilot,
  // 2026-08-15 — "I didn't really understand the local log"). The cloud console is one route to these
  // three; the free deployment has its own, and an unreachable button now says which.
  const jump=(u,label,hint)=>`<a class="jump ${(u&&u!="#")?"":"off"}" href="${u?esc(safeUrl(u)):"#"}"`
    + `${hint&&!u?` title="${esc(hint)}"`:""} target="_blank">${label} ↗</a>`;
  box.innerHTML=`
    <div class="rowg">
      <div class="gauge"><span class="lbl">harness</span><b>${esc(f.harness)}</b></div>
      <div class="gauge"><span class="lbl">auth</span><b>${esc(f.auth_format)}${f.auth_credential?` <small style="opacity:.7">${esc(f.auth_credential)}</small>`:""}</b></div>
      <div class="gauge"><span class="lbl">models</span><b>${modelsHtml}</b></div>
      <div class="gauge"><span class="lbl">review</span><b>${f.review_mode?esc(f.review_mode):'<span style="opacity:.55">unknown</span>'}</b></div>
      <div class="gauge"><span class="lbl">token pool</span><b><span class="dots">${dots}</span> ${t.count} <small>(${esc(t.source||"")})</small></b></div>
      ${f.region?`<div class="gauge"><span class="lbl">region</span><b>${esc(f.region)}</b></div>`:""}
    </div>
    <div class="links">
      ${jump(L.board,"Board")}${jump(L.temporal,"Engine")}
      ${L.cloudwatch
        ? jump(L.cloudwatch,"Logs")
        : `<a class="jump" href="#" onclick="event.preventDefault();openLogs('${esc(name)}')"
             title="every job's log, from the journals on this machine">Logs</a>`}
      ${jump(L.ssm,"Parameters",".env.compose on this machine — the file this stack reads")}
      ${jump(L.ecs,"Tasks","docker ps — the boxes run on this machine")}
    </div>
    <!-- READ-ONLY IS NOT THE SAME AS CLOSED. This row showed six decisions and no way to reach
         any of them, so an operator who had chosen none of them read the factory as a black box
         (2026-08-14: "very black box… it has to offer the option to know and to change things if you want"). No
         editing UI is invented here — every line names the command or the file that owns the
         decision, which is where it is actually changed and reviewed. -->
    <details class="howto">
      <summary>how to change any of this</summary>
      <dl>
        <dt>models</dt><dd><code>openfactory project set-model ${esc(name)} &lt;model&gt;</code>
          — one string for every role, or <code>--role executor|reviewer|techlead|product</code>
          for one. It is passed to the harness verbatim (each CLI names models its own way,
          including a Bedrock inference-profile ARN). <b>agent default</b> above means nobody has
          chosen: the harness's own default is in force.</dd>
        <dt>the agents themselves — prompts, guidelines, TDD</dt>
          <dd>the role prompts are files:
          <code>openfactory/org_defaults/roles/{executor,planner,sizer,techlead,coordinator,recovery,product}.md</code>.
          TDD and the engineering standards live in the executor's, handed to it on every job.
          The independent REVIEWER has no file on purpose — a deployment must not be able to
          soften the one voice that judges the work.
          <b>They are baked into the worker image</b>: editing them changes nothing until
          <code>docker compose --env-file .env.compose up -d --build</code>.</dd>
        <dt>harness &amp; auth</dt><dd>the harness is the project's registry entry
          (<code>openfactory project add … --harness</code>, or <code>harness:</code> in the
          registry); the route and its credential come from the deployment's environment
          (<code>.env.compose</code>) — subscription vs API key is which of
          <code>CLAUDE_CODE_OAUTH_TOKEN</code> / <code>ANTHROPIC_API_KEY</code> is set.</dd>
        <dt>review</dt><dd><code>advisory</code> means the independent review informs and does
          not block; the gate that decides whether a human merges is <code>merge_policy:</code>
          in the repository's own <code>.openfactory/project.yaml</code>.</dd>
        <dt>logs — where the work's output is</dt>
          <dd>the <b>Logs</b> button above lists every run this deployment has made, read from the
          journals on this machine — including runs the engine has already forgotten. A running job
          also streams into the floor card, and a finished one shows the same log in its briefing.
          The engine's own history — every workflow, retry and activity — is the <b>Temporal</b>
          button. The stack's own output is
          <code>docker compose --env-file .env.compose logs -f worker</code>. All of it is local
          and free — no account anywhere. Move the boxes to a cloud
          (<code>OPENFACTORY_SANDBOX=fargate</code>) and the run's output goes to that cloud's log
          service instead, with the same button pointing at it.</dd>
        <dt>a paused job continuing</dt>
          <dd>when the harness hits its usage limit the job pauses and the resumed run
          <b>continues the same session</b> instead of replanning — no object store to buy. The
          session is kept in <code>OPENFACTORY_RESUME_DIR</code> on this machine and swept after
          7 days; a deployment whose boxes run in a cloud sets
          <code>OPENFACTORY_RESUME_BUCKET</code> and it crosses through there instead.</dd>
        <dt>parameters &amp; secrets</dt>
          <dd>one file on this machine: <code>.env.compose</code> (keep it <code>chmod 600</code>;
          it is git-ignored). Nothing is stored outside your machine. A cloud deployment reads its
          parameter store instead (AWS SSM today) and the button for it appears here.</dd>
        <dt>where the work actually runs</dt>
          <dd>by default each job gets a throwaway container on this machine —
          <code>OPENFACTORY_SANDBOX=container</code>, watch them with <code>docker ps</code>. The
          image is <code>box.image</code> in the deployment's REGISTRY, not in the repository:
          an agent that could name its own image would be choosing the machine that runs it. Set
          <code>fargate</code> to run them in AWS instead; nothing else about the factory changes.</dd>
        <dt>board &amp; tracker</dt>
          <dd>the project's registry entry — <code>openfactory project add …</code> chose it, and
          the <b>Board</b> button opens it. GitHub Projects, Azure DevOps Boards and Jira are all
          supported; the factory only ever reads TO-DO and writes back state.</dd>
        <dt>token pool</dt><dd>deployment-level, in <code>.env.compose</code> —
          how many harness credentials this installation can rotate through. <b>region</b> shows
          up beside it only once this deployment has a cloud; a local one has none.</dd>
      </dl>
      <p class="dim">Everything above is read from the deployment right now — the agents are
        walked in <code>docs/ONBOARDING.md</code> §11, and every surface above (logs, secrets,
        boxes) with its free answer in §12.</p>
    </details>`;
}
// RECENT RUNS IS HISTORY, AND HISTORY BELONGS TO THE DURABLE RECORD (#131). This list was built
// from the engine alone, and the engine forgets: the pilot opened his floor ~26h after shipping
// two tickets and read "nothing shipped yet" — a claim, and a false one, while both journals sat
// on disk. Raising the retention to 30 days (#131) shortens that window; it does not close it,
// because on day 31 the same screen would tell the same lie.
//
// So the engine stays the LIVE half (status, gates, wedged, deploy — everything a running job
// needs) and the journals are the half that outlives it. Fetched once per project view, not per
// tick: a finished run's journal does not change, and re-reading it every three seconds would be
// spending IO to re-learn a fact.
async function loadJournalRuns(name){
  window._journalRuns=[];
  try{
    const all=await api("/api/jobs");
    window._journalRuns=(all||[]).filter(j=>j.project==name);
  }catch(e){
    // A journal directory we could not read is NOT an empty history. Left as [] here, and the
    // empty state below says which of the two it is looking at.
    window._journalUnread=true;
  }
  renderRecent();
}

// The engine's rows win where both have the job (they carry the title, the gates and the deploy);
// a journal row appears only for a run the engine no longer holds, and says so.
function mergeRecent(fromEngine){
  const seen=new Set(fromEngine.map(j=>String(j.issue)));
  const forgotten=(window._journalRuns||[])
    .filter(j=>!seen.has(String(j.issue)))
    .map(j=>({project:j.project,issue:j.issue,state:j.state,close_time:j.updated,
              cost_usd:j.cost_usd,pr_url:j.pr_url,events:j.events,forgotten:true}));
  return [...fromEngine,...forgotten]
    .sort((a,b)=>String(b.close_time||"").localeCompare(String(a.close_time||"")));
}

function refreshProject(){
  const name=curProject();if(!name)return;
  const js=engine.jobs.filter(j=>j.project==name);
  const active=js.filter(j=>j.status=="running");
  window._recent=mergeRecent(js.filter(j=>j.status!="running"));
  // The floor runs one job at a time (single agent token), so a manual "Scan TO-DO now"
  // while something is running would only queue behind it — surface it ONLY when the floor
  // is idle (no job running anywhere), otherwise hide it to avoid a no-op click.
  // Single-line strict (ADR-0010): a PARKED job (impediment or a rate-limit pause) HOLDS the
  // floor. Surface it right where "Scan TO-DO" lives, with Resume/Skip — the operator's only
  // way to advance the queue. Hide "Scan" whenever anything (running OR parked) occupies the floor.
  const parked=engine.jobs.find(j=>j.project==name && j.action);
  const fc=$("#floorCtl");
  // While in the merge watch there is no live task feed, so the card's "⏳ starting…" line
  // would sit there misleading (the 7.5h #69 confusion) — overwrite it with the truth.
  const mw=engine.jobs.find(j=>j.project==name && j.action && j.action.kind=="merge_wait");
  const mnow=$("#mnow");
  // WORKING FIRST (#151). The engine raises `working` while a repair pass this operator ASKED
  // for rewrites the branch. Reading only `kind=="merge_wait"` made this line say "waiting for
  // your review" over a pull request being rewritten under it — the card's own headline, fixed on
  // the floor headline and the census and left standing here.
  if(mw&&mnow){mnow.innerHTML=mw.action.working
    ?"✏️ a repair pass is rewriting this pull request — it will ask again when the pass ends"
    :mw.action.auto
    ?`⏳ auto-merge armed — ${VOCAB.merge_wait.auto}`
    :`PR ready — waiting for <b>your</b> review &amp; merge (<a href="${esc(safeUrl(mw.action.pr_url||"#"))}" target="_blank">open PR ↗</a>)`;}
  // A parked impediment/decision has NO live feed either — a crashed/timed-out job's Fargate task
  // is gone, so the card would otherwise sit forever on a stale "▸ Repairing" as if work
  // continues (the #394 confusion). State the truth on the card itself, not just the top banner.
  if(parked && parked.action && parked.action.kind!="merge_wait" && mnow){
    const a=parked.action;
    const why=a.decision?("decision needed — "+(a.decision.question||"choose"))
      :(a.kind=="rate_limit"?("paused (usage limit)"+(a.note?" — "+a.note:"")):(a.note||a.state||"needs your action"));
    mnow.innerHTML=`⏸ parked — ${esc(why)}`;
    const stn=$("#mstn"); if(stn)stn.textContent="parked";
    const mb=$("#mbadge"); if(mb){mb.className="badge b-err"; mb.textContent=a.kind=="rate_limit"?"paused":"needs action";}
  }
  if(fc){
    if(parked && parked.action.kind=="merge_wait"){
      // The PR exists and the job holds the floor until it lands. Human path (auto=false)
      // NEEDS the operator: review + merge — this was invisible for 7.5h once; never again.
      // TRANSPARENCY: show WHAT the wait is on (CI re-running / behind base, rebasing) so a wait
      // never looks like nothing is happening — and link to the EXISTING PR (not "open" it).
      const a=parked.action, pr=esc(safeUrl(a.pr_url||"#"));
      const prn=(a.pr_url||"").split("/").filter(Boolean).pop()||"";
      const on=a.note?` — ${esc(a.note)}`:"";
      fc.innerHTML=(a.working
        ?`<span class="badge b-run" style="margin-right:8px">✏️ #${esc(parked.issue)} repair pass running${on}</span>`
        :a.auto
        ?`<span class="badge b-run" style="margin-right:8px">⏳ #${esc(parked.issue)} waiting to merge${on}</span>`
        :`<span class="badge b-err" style="margin-right:8px">#${esc(parked.issue)} PR ready — needs YOUR answer${on}</span>`)+
        `<a class="btn sm" href="${pr}" target="_blank">View PR${prn?" #"+esc(prn):""} ↗</a>`+
        // THE THREE ANSWERS (#68). Only on the HUMAN path: when auto=true the machine is merging
        // it and there is nothing to ask. Before this the operator's only option was the link —
        // i.e. go and do the work on github.com by hand, which is the work this product removes.
        // NOTHING TO PRESS WHILE A PASS RUNS. The three answers are offered when the machine is
        // waiting on a person — not while it is doing the work that person asked for. The server
        // refuses them too (`gate_cannot_hear`); this is so a person is never shown a button that
        // will be refused.
        (a.auto||a.working?"":
          ` <button class="btn sm" data-act="mergeGate" data-p="${esc(name)}" data-i="${esc(parked.issue)}" data-k="merge" title="land the PR — the forge can still refuse it if branch protection says so, and the job will say why">Merge</button>`+
          // THE FOURTH ANSWER, WHERE THE JOB SAYS IT IS REAL (#181). Never rendered from this
          // page's own belief: a re-review offered on a deployment with no reviewer is advice
          // nobody can take, which is the rule the tech-lead already lives under.
          (a.can_review?` <button class="btn sm ghost" data-act="mergeGate" data-p="${esc(name)}" data-i="${esc(parked.issue)}" data-k="review" title="reads the pull request AS IT STANDS and replaces the verdict on this card — it changes no code, and it costs a model pass">Re-review</button>`:"")+
          ` <button class="btn sm ghost" data-act="mergeGate" data-p="${esc(name)}" data-i="${esc(parked.issue)}" data-k="adjust" title="one more agent pass on the SAME branch and PR, against your own words">✏️ Adjust…</button>`+
          ` <button class="btn sm ghost" data-act="mergeGate" data-p="${esc(name)}" data-i="${esc(parked.issue)}" data-k="discard" title="close the PR without merging and free the floor — the branch and its commits stay">Discard</button>`);
    } else if(parked){
      const a=parked.action||{}, rl=a.kind=="rate_limit", dec=a.decision;
      if(dec && dec.options && dec.options.length){
        // DECISION with options — render the question + a button per option (no park without
        // options). Each button POSTs action=resume with the chosen key; the agent resumes with
        // that decision injected. The full context is on hover + on the ticket.
        const btns=dec.options.map(o=>
          `<button class="btn sm${o.recommended?"":" ghost"}" title="${esc(o.consequence||"")}${o.recommended?" (recommended)":""}" data-act="actJobChoice" data-p="${esc(name)}" data-i="${esc(parked.issue)}" data-k="${esc(o.key)}">${esc(o.key)} · ${esc(o.label)}</button>`
        ).join(" ");
        fc.innerHTML=`<span class="badge b-err" style="margin-right:8px;max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle" title="${esc(dec.context||"")}">#${esc(parked.issue)} decision needed: ${esc(dec.question||"choose")}</span>`+
          btns+` <button class="btn sm ghost" data-act="actJob" data-p="${esc(name)}" data-i="${esc(parked.issue)}" data-k="skip" title="give up on this ticket — free the floor">⏭ Skip</button>`;
      } else {
        const whyFull=a.note||a.state||"needs attention";
        // keep the banner one line — a long note is truncated here, full text on hover.
        const why=esc(whyFull.length>110?whyFull.slice(0,110)+"…":whyFull);
        fc.innerHTML=`<span class="badge ${rl?"b-run":"b-err"}" style="margin-right:8px;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle" title="${esc(whyFull)}">⏸ #${esc(parked.issue)} ${rl?"paused (usage limit)":"needs you"}: ${why}</span>`+
          `<button class="btn sm" data-act="actJob" data-p="${esc(name)}" data-i="${esc(parked.issue)}" data-k="resume" title="${rl?"retry now instead of waiting for the backoff":"you fixed the ticket — re-run it from the top"}">▶ ${rl?"Retry now":"Resume"}</button> `+
          `<button class="btn sm ghost" data-act="actJob" data-p="${esc(name)}" data-i="${esc(parked.issue)}" data-k="skip" title="give up on this ticket — free the floor and move the queue on">⏭ Skip</button>`;
      }
    } else {
      // A WEDGED JOB — running, at no gate, past the hour any real pass takes (#127). Nothing
      // above matches it, because it is not parked and not at a gate, and until now the floor
      // card showed an operator nothing at all while the queue stood still behind it. The
      // server decides `wedged` against the same constant the tech-lead's rounds use to raise
      // the alarm; re-deriving it here could only disagree with the message they were sent.
      const stuck=(engine.jobs||[]).find(j=>j.wedged);
      fc.innerHTML=stuck
        ?`<span class="badge b-err" style="margin-right:8px">⚠️ #${esc(stuck.issue)} has been running with no gate and no park for hours — nothing here can advance it</span>`+
         // DATA ATTRIBUTES, NOT A JS STRING IN AN ATTRIBUTE (#119's ratchet). `esc()` maps `'` to
         // `&#39;`, which is right for text and wrong here: the HTML parser decodes it back
         // BEFORE the script is parsed, so a value carrying a quote breaks out of the call.
         `<button class="btn sm ghost" data-stop data-p="${esc(name)}" data-i="${esc(stuck.issue)}" title="end this job and free the floor — it does NOT resume: the ticket goes back to the board and a fresh job starts from the beginning">✖ Stop</button>`
        :"";
      const sbtn=fc.querySelector("[data-stop]");
      if(sbtn)sbtn.addEventListener("click",()=>stopJob(sbtn.dataset.p,sbtn.dataset.i));
    }
  }

  // STOPPING IS NOT UNDOABLE, so it asks — the only button on this page that does. Every other
  // action here is reversible (a skip leaves the ticket, a discard leaves the branch); this one
  // loses whatever the run had in flight.
  async function stopJob(project,issue){
    if(!confirm(`Stop #${issue}?\n\nThis ends the job and frees the floor. It does NOT resume — the ticket goes back to the board and a fresh job starts from the beginning, so anything this run had in flight is lost.`))return;
    const why=prompt("Why? (goes on the ticket, optional)")||"";
    try{
      const r=await mfetch("/api/act/stop",{method:"POST",
        headers:{"content-type":"application/json"},
        body:JSON.stringify({params:{project,issue,reason:why}})});
      const d=await r.json().catch(()=>({}));
      toast(d.ok?(d.message||"stopped"):(d.detail||d.message||"refused"));
    }catch(e){toast("could not reach the worker")}
  }
  const sb=$("#scanBtn");
  if(sb)sb.style.display=(engine.jobs.some(j=>j.status=="running")||parked)?"none":"";
  const act=$("#active");
  if(act){
    // Only (re)render the machine card when the SET of running jobs changes. Re-rendering
    // on every engine frame would wipe the live log feed + reset the pipeline to
    // "starting…" — the card must persist and be updated in place by the log-feed SSE.
    //
    // AN IDLE FLOOR HAS NO JOBS, SO ITS KEY WAS ALWAYS "" AND IT NEVER REDREW (#133). The idle
    // copy is built from state that arrives LATER and changes without any job starting — the
    // project's pickup (fetched by `loadCockpit`, milliseconds after the first paint) and the
    // intake schedule. So the card kept whatever it was drawn with: the pilot enabled his
    // project, the server returned `pickup_enabled: true`, and the screen went on saying "I
    // could not read whether this project's pickup is on" until a job happened to start.
    //
    // With jobs running the key is the job set, exactly as before — the live-feed guarantee
    // above is untouched, because the idle inputs only enter the key when there is no card to
    // preserve.
    // …AND THE IDLE CARD IS NOW THE HEADER'S OWN ANSWER, rendered large (#141). It used to be a
    // five-branch ternary of its own — a second computation, in a second vocabulary, directly
    // under a header that had reached its own conclusion. That is how `floor: running` came to sit
    // on top of `Floor idle`. There is one computation now; this draws its result.
    const fs=floorNow();   // the page is scoped to this project, so this IS its verdict
    const key=active.length
      ? active.map(j=>j.project+"#"+j.issue).join(",")
      : `idle|${fs.cause}|${fs.level}|${fs.clause}`;
    if(key!==window._machineKey){
      window._machineKey=key;
      if(active.length){
        act.innerHTML=active.map(machineCard).join("");
        const first=active[0];
        openFeed(first.project,first.issue);
      }else{
        // The glyph agrees with the word by construction, because both come from `level`. It used
        // to be computed by a separate expression, so a change to the copy could leave the pause
        // glyph over a reassuring sentence.
        const glyph={ok:"—",clock:"◷",warn:"!",err:"⏸",unknown:"?"}[fs.level]||"—";
        act.innerHTML=`<div class="empty"><div class="big">${glyph}</div>`
          +`<b style="color:var(--muted)">${esc(fs.word)}</b><br>${esc(fs.clause)}`
          +(fs.cmd?`<br><span class="cmd">${esc(fs.cmd)}</span>`:"")
          +(fs.detail?`<br><span style="opacity:.7">${esc(fs.detail)}</span>`:"")
          +"</div>";
        if(es){es.close();es=null;focus=null}
      }
    }
    // same running set → leave the card + its live feed untouched (SSE updates it in place)
    // …but DO sync the ticket title in-place: the memo is stamped a few seconds AFTER the job
    // shows as running, so the card is first drawn title-less and must pick it up on a later
    // tick without a full re-render (which would reset the live feed).
    const mt=$("#mtitle");
    if(mt && active[0]) mt.innerHTML=tkTitle(active[0]);
  }
  renderRecent();
}
// searchable history — filter the recent runs by issue number, domain status, or date
const _RECENT_PAGE=20;   // "more" reveals this many additional rows
function renderRecent(){
  const rec=$("#recent");if(!rec)return;
  const term=(($("#hsearch")||{}).value||"").trim().toLowerCase();
  let list=window._recent||[];
  if(term)list=list.filter(j=>`#${j.issue} ${j.title||""} ${j.state||j.status} ${(j.close_time||"").slice(0,10)} ${j.workflow_id}`.toLowerCase().includes(term));
  const rc=$("#recCnt");if(rc)rc.textContent=list.length;
  // The history is unbounded, so reveal progressively: 10 rows, then +20 per "more" click.
  // The reveal count persists across engine ticks (so an expanded list stays expanded) and
  // is reset to 10 on a new search / project navigation (onRecentSearch / renderProject).
  if(!window._recentShown)window._recentShown=10;
  const shown=Math.min(window._recentShown,list.length);
  if(!list.length){
    // "NOTHING SHIPPED YET" IS A CLAIM, so it is only made when both records agree (#131). The
    // engine forgetting is not the floor being idle, and a journal directory we could not read is
    // neither — each gets its own sentence, because they send an operator to different places.
    const said=term?"no match"
      :window._journalUnread
        ?"the engine has no runs and the journals could not be read — nothing here is evidence "
         +"that nothing ran; check the worker's log directory"
        :"nothing shipped yet";
    rec.innerHTML=`<div class="empty" style="padding:24px">${esc(said)}</div>`;
    return;
  }

  rec.innerHTML=html;
}

function stations(reached,mode){
  let h="";
  STN.forEach((s,i)=>{
    let c=(mode=="merged"||i<reached)?"done":i==reached?(mode=="failed"?"err":"act"):"";
    const ic=c=="done"?"✓":c=="err"?"✕":i+1;
    h+=`<div class="stn ${c}" title="${esc(s[2]||"")}"><div class="node">${ic}</div><span>${s[1]}</span></div>`;
    if(i<STN.length-1){let f=(mode=="merged"||i<reached)?"fill":(i==reached&&mode=="running")?"flow":"";
      h+=`<div class="belt ${f}"></div>`}
  });
  return h;
}

// live station feed for the focused machine (SSE over the job's journal — CloudWatch only
// backs it when the box that wrote it runs in a cloud this panel cannot reach)
function openFeed(p,i){
  if(es)es.close();
  focus={p,i,reached:-1,mode:"running",cost:0};
  es=new EventSource(`/api/jobs/${p}/${i}/stream`);
  es.onmessage=ev=>{try{onEvent(JSON.parse(ev.data))}catch(e){}};
}
// ONE rendering of an event line, so the log of a finished job is the same log the operator
// watched while it ran. Used live (SSE) and replayed from the journal in the briefing.
function evLine(e){
  let msg=esc(e.message);
  if(e.kind=="pr"&&e.data&&e.data.url)msg=`<a href="${esc(safeUrl(e.data.url))}" target="_blank">${msg}</a>`;
  // an agent action tagged with a role shows the ROLE (PLANNER / EXECUTOR) — that's
  // what changes line to line; the harness is shown once, in the cockpit (resolved per project).
  const label=(e.kind=="agent_action"&&e.data&&e.data.role)
    ?String(e.data.role).toUpperCase()
    :(KLABEL[e.kind]||String(e.kind||"").replace("_"," ").toUpperCase());
  let h=`<div class="ev"><time>${esc((e.ts||"").slice(11,19))}</time><span class="k k-${esc(e.kind)}">${esc(label)}</span><span class="msg">${msg}</span></div>`;
  // a REJECTED review now carries its findings — show WHY, not just the score
  if(e.kind=="review"&&e.data&&Array.isArray(e.data.detail)&&e.data.detail.length)
    h+=e.data.detail.map(f=>`<div class="ev" style="padding-left:64px"><span class="badge ${_sev(f.severity)}" style="margin-right:6px">${esc(f.severity)}</span><span class="msg">${esc(f.description||"")}${f.file?` <span class="mono sub" style="font-size:11px">${esc(f.file)}${f.line?":"+f.line:""}</span>`:""}</span></div>`).join("");
  return h;
}
function onEvent(e){
  const feed=$("#feed");
  const w=$("#feedwait");if(w)w.remove();  // first real event replaces the "connecting…" line
  if(feed){
    feed.insertAdjacentHTML("beforeend",evLine(e));
    feed.scrollTop=feed.scrollHeight}
  if(e.kind=="state"){
    const idx=STN.findIndex(s=>s[0]===e.message);
    // A run BEGINS at spec_validation. Anchor "running for" to it so the timer shows the CURRENT
    // attempt — a resumed job keeps its original workflow start_time, which made a 2-min re-run
    // read as "1h46m". On a re-run the pipeline re-enters spec_validation → the timer resets.
    if(e.message=="spec_validation"&&e.ts){const rf=$("#mrun");if(rf)rf.setAttribute("data-since",e.ts);}
    if(idx>=0)focus.reached=Math.max(focus.reached,idx);
    if(e.message=="repairing")focus.reached=Math.max(focus.reached,STN.findIndex(s=>s[0]=="validating"));
    if(e.message=="failed"||e.message=="needs_refinement")focus.mode="failed";
    else if(e.message=="merged"||e.message=="done")focus.mode="merged";
    const pipe=$("#mpipe");if(pipe)pipe.innerHTML=stations(focus.reached,focus.mode);
    const now=$("#mnow");if(now)now.textContent="▸ "+(NOW[e.message]||e.message);
    const st=$("#mstn");const label=(STN[focus.reached]||["","—"])[1];
    if(st)st.textContent=SHIPPED.has(e.message)?"shipped":ALARM.has(e.message)?e.message:label;
    // keep the header badge honest — the true live state, never a hardcoded "in production"
    const mb=$("#mbadge");
    if(mb){const term=SHIPPED.has(e.message),al=ALARM.has(e.message);
      mb.className="badge "+(term?"b-ok":al?"b-err":"b-run");
      mb.textContent=term?"shipped":e.message;}
    const left=$("#mleft"),leftline=$("#mleftline"),rem=STN.slice(focus.reached+1);
    if(left)left.textContent=rem.length?rem.length+" stations":"—";
    if(leftline)leftline.innerHTML=rem.length?`remaining: <b>${rem.map(s=>s[1]).join(" · ")}</b>`:"";
    const pb=$("#promoteBtn");if(pb)pb.style.display=(e.message=="awaiting_prod_approval")?"inline-flex":"none";
  }
  if(e.kind=="note"&&e.data&&e.data.cost_usd){focus.cost+=e.data.cost_usd;
    const c=$("#mcost");if(c)c.textContent="$"+focus.cost.toFixed(2)}
  // A: surface WHICH credential of the pool is live (partner asked to see token 1/2/…/N) and
  // flag when failover just rotated us onto the next one — proof the pool rotates.
  if(e.kind=="note"&&e.data&&e.data.credential){const cr=e.data.credential;
    const el=$("#mcred");if(el){
      el.textContent=`${cr.index}/${cr.total} (${cr.id||"?"})`+(cr.rotated?" ↻":"");
      el.classList.toggle("amber",!!cr.rotated)}}
  if(e.kind=="pr"&&e.data&&e.data.url)toast(`${focus.p} #${focus.i}`,"PR shipped","ok");
}

// The deployment with a cloud has a console listing every run. The free one has the same thing and
// had no door to it: every job writes a journal on this machine, `/api/jobs` reads them, and until
// now nothing in this page called it. The floor and the history come from the ENGINE, so a job
// whose workflow history has aged out disappeared from the panel while its log sat on disk.
const _LOG_CAP=400;   // newest lines rendered at once; a four-hour pass writes thousands. The
                      // Logs page offers "show all"; the job briefing keeps the cap.
function logBlock(evs){
  if(!evs||!evs.length)
    return `<div class="sub" style="font-size:12px">no journal for this run on this machine — the whole stack's output is <code>docker compose --env-file .env.compose logs worker</code></div>`;
  const shown=evs.slice(-_LOG_CAP);
  const more=evs.length-shown.length;
  return (more?`<div class="sub" style="font-size:11px;margin-bottom:4px">showing the last ${shown.length} of ${evs.length} events</div>`:"")
    +`<div class="feed" style="max-height:300px">${shown.map(evLine).join("")}</div>`;
}

//: what the page holds between renders — the runs it read, and the one being read.
let _logs={rows:null,error:"",loaded:"",events:null,all:false};

async function renderLogsPage(){
  const at=curLogs();

        at.project?` · <a href="#" onclick="event.preventDefault();go('/logs')">every project</a>`:""}.

    try{
      const r=await api("/api/jobs");

    }catch(e){ _logs.rows=[]; _logs.error=String((e&&e.message)||e) }

function paintLogList(){
  const q=((($("#logq")||{}).value)||"").trim().toLowerCase();
  const sel=$("#logstate");
  const states=[...new Set((_logs.rows||[]).map(r=>r.state).filter(Boolean))].sort();
  if(sel&&sel.options.length!==states.length+1){
    const keep=sel.value;
    sel.innerHTML=`<option value="">every state</option>`
      +states.map(s=>`<option>${esc(s)}</option>`).join("");
    sel.value=keep;
  }
  const want=(sel&&sel.value)||"";
  const at=curLogs()||{};
  const rows=(_logs.rows||[]).filter(r=>
    (!at.project||r.project===at.project)
    && (!want||r.state===want)
    && (!q||`${r.project} #${r.issue} ${r.state||""}`.toLowerCase().includes(q)));
  const list=rows.map(r=>`<div class="row logrow ${(r.project===at.project&&String(r.issue)===String(at.issue))?"on":""}"
      data-p="${esc(r.project)}" data-i="${esc(r.issue)}" onclick="openJobLog(this.dataset.p,this.dataset.i)">
      <span class="tk">#${esc(r.issue)}</span>
      <div class="grow"><b style="color:var(--txt)">${esc(r.project)}</b>
        <div class="sub">${esc((r.updated||"").slice(0,16).replace("T"," "))} · ${r.events||0} events${r.cost_usd!=null?" · $"+Number(r.cost_usd).toFixed(2):""}</div></div>
      <span class="badge ${domBadge(r.state)}">${esc(r.state||"—")}</span></div>`).join("");
  const cnt=$("#logCnt"); if(cnt)cnt.textContent=rows.length;
  const box=$("#loglist"); if(!box)return;
  // AN EMPTY LIST IS A QUESTION, NOT A FULL STOP. "no journals", "nothing has run" and "the panel
  // could not ask" are one screen and three situations, and an operator who meets this on a
  // healthy factory needs the next step rather than a fact: the floor writes a log when it TAKES
  // a card, and it only takes from TO-DO (pilot, 2026-08-15 — a card in Backlog, a green floor,
  // and an empty box that explained neither).
  box.innerHTML=list||`<div class="empty" style="padding:24px">${
    _logs.error?`couldn't read the journals: ${esc(_logs.error)}`
    :(_logs.rows||[]).length?"no run matches this filter"
    :`no job has run on this deployment yet, so there is nothing to read.<br><br>
      A run starts when the factory takes a card from <b>TO-DO</b> — move one there on your board
      (a card in Backlog is yours, not the factory's) and it is picked up on the next scan, or
      press <b>Scan TO-DO now</b> on the project.`}</div>`;
}
async function loadJobLog(project,issue){
  const box=$("#logdetail"); if(!box)return;
  const key=`${project}#${issue}`;
  if(_logs.loaded!==key){
    box.innerHTML=`<div class="empty" style="padding:24px">reading ${esc(project)} #${esc(issue)}…</div>`;
    try{
      const r=await api(`/api/jobs/${encodeURIComponent(project)}/${encodeURIComponent(issue)}/events`);
      _logs.events=Array.isArray(r)?r:[];
    }catch(e){ _logs.events=[] }
    _logs.loaded=key; _logs.all=false;
  }
  paintJobLog(project,issue);
}
function paintJobLog(project,issue){
  const box=$("#logdetail"); if(!box)return;
  const q=((($("#logfind")||{}).value)||"").trim().toLowerCase();

      <span class="rule"></span><span class="cnt">${evs.length}</span></div>

    ${hidden>0?`<div class="sub" style="font-size:var(--t-xs);margin-bottom:6px">showing the last ${shown.length} of ${evs.length} · <a href="#" onclick="event.preventDefault();_logs.all=true;paintJobLog('${esc(project)}','${esc(issue)}')">show all</a></div>`:""}
    ${evs.length
      ?`<div class="feed logfeed">${shown.map(evLine).join("")}</div>`
      :`<div class="empty" style="padding:24px">${(_logs.events||[]).length?"no line matches":"this run wrote no journal on this machine"}</div>`}`;
  const f=$("#logfind"); if(f&&q){f.focus();f.setSelectionRange(q.length,q.length)}
}

      <th class="num">median in / out</th>
      <th class="num">median cost</th><th class="num">median time</th>
      <th class="num">mean turns</th></tr></thead>
      <tbody id="dKnowRows"></tbody></table>
    <div id="dKnowBaseline" style="display:none;padding:10px 0 0"></div>
    <div class="sub" style="padding:8px 0 0">
      <b>TOKENS are the primary measure</b>, not cost: the hypothesis is that the map makes an agent
      read less to find the same code, and tokens measure that directly. Cost depends on per-model
      pricing and simply does not exist for a harness that reports no price (Codex).<br>
      <b>injected</b> = the agent was given the map · <b>off</b> = the project did not opt in ·
      <b>map unavailable</b> = opted in, but the map was not trustworthy for that job's checkout (it
      ran WITHOUT it, so it counts as a control).<br>
      Each ticket is assigned an arm, so both run on the <b>same platform version</b>, the same week
      and the same codebase — whatever difference is left is the map, not the calendar.<br>
      Compare medians, not just means: ticket size varies enormously, and one large ticket in a small
      arm moves the mean without proving anything. The delta is arithmetic, not a verdict: it is only
      comparable if the mix of tickets is similar, and nothing here knows whether it is.
    </div>
  </div>
  <div class="chartbox" style="overflow:auto">
    <div class="k">tasks — time and cost of each</div>
    <table><thead><tr>

      <th class="num">turns</th><th class="num">time</th><th class="num">cost</th></tr></thead>
      <tbody id="dRows"></tbody></table>
  </div>`;
  ["fModel","fHarness","fRole","fKnow","fFrom","fTo"].forEach(id=>$("#"+id).addEventListener("change",_dashApply));
}
function _dashReset(){ ["fModel","fHarness","fRole","fKnow","fFrom","fTo"].forEach(id=>{$("#"+id).value=""}); _dashApply(); }
function _mkChart(id,type,labels,data,color){

  const ctx=$("#"+id); if(!ctx||!window.Chart)return;
  _dc[id]=new Chart(ctx,{type,data:{labels,datasets:[{data,backgroundColor:color,borderColor:Array.isArray(color)?color:color,fill:false,tension:.3,borderWidth:2}]},
    options:{plugins:{legend:{display:type=="doughnut",position:"bottom",labels:{color:"#9aa",boxWidth:12,font:{size:11}}}},
      scales:type=="doughnut"?{}:{x:{ticks:{color:"#888",font:{size:10}},grid:{color:"rgba(255,255,255,.05)"}},y:{ticks:{color:"#888"},grid:{color:"rgba(255,255,255,.05)"}}},
      responsive:true,maintainAspectRatio:false}});
}
function _dashApply(){

    &&(!f.from||r.date>=f.from)&&(!f.to||r.date<=f.to));
  let tickets=[...new Set(runs.map(r=>r.ticket))];

  // means the project opted in but the map could not be trusted for that checkout, so the agent
  // ran WITHOUT it: grouping it under "with" would count controls as treatment.
  if(f.know){ tasks=tasks.filter(t=>_hasMap(t.knowledge)===(f.know==="with"));
    tickets=tasks.map(t=>t.ticket);

  const byDay={}; runs.forEach(r=>{byDay[r.date]=(byDay[r.date]||0)+(r.cost_usd||0)});

  const bh=_sumBy(runs,"harness"); _mkChart("cHarness","bar",Object.keys(bh),Object.values(bh).map(v=>+v.toFixed(2)),"#5aa9e6");

    <td class="num">${t.turns||"—"}</td><td class="num">${_fmtDur(t.wall_s)}</td>
