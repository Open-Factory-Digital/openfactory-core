// The A/B arm of one task. Recomputed from the FILTERED tasks, so narrowing by date/model
// narrows the comparison too — otherwise the block would contradict the table above it.
const _ARM_B={injected:"b-ok",off:"b-dim",unavailable:"b-run",pre_okf:"b-run"};
// What each arm MEANS, in the terms the reader cares about: did the agent have the map or not.
// Labels that a reader can TELL APART. "without map" and "without map*" differed by an asterisk, which
// is not a label — two different things looked like one, in the block whose whole job is to keep
// them separate.
const _ARM_L={injected:"with map",off:"without map",unavailable:"map unavailable",
              pre_okf:"historical (before the A/B)"};
const _ARM_T={injected:"the agent was given the module map",
              off:"this project did not opt into the map",
              unavailable:"opted in, but the map was not trustworthy for this checkout — it ran WITHOUT it",
              pre_okf:"ran before the arm was recorded. The flag has always defaulted to false, so it demonstrably ran without the map — a real baseline, but not a chosen control"};
// An empty arm is `pre_okf`, not "unknown": `knowledge_map` has defaulted to false since the field
// existed, so a ticket with no recorded arm demonstrably ran without the map. Showing "—" on 45 of
// 46 rows hid exactly the baseline this dashboard exists to establish.
function _arm(a){ return a||"pre_okf"; }
function _hasMap(a){ return _arm(a)==="injected"; }
function _armBadge(a){ const k=_arm(a);
  return `<span class="badge ${_ARM_B[k]||"b-dim"}" title="${esc(_ARM_T[k]||"")}">${esc(_ARM_L[k]||k)}</span>`; }
function _med(xs){ if(!xs.length)return null; const s=[...xs].sort((a,b)=>a-b), m=s.length>>1;
  return s.length%2?s[m]:(s[m-1]+s[m])/2; }
function _renderKnowledgeAB(tasks){
  const box=$("#dKnow"); if(!box)return;
  // Recomputed from the FILTERED tasks, so narrowing by date/model narrows the comparison too —
  // otherwise this block would contradict the table above it. A task with no recorded arm counts
  // as pre_okf: the flag has always been false, so it demonstrably ran without the map.
  const all={};
  tasks.forEach(t=>{ const a=_arm(t.knowledge);
    (all[a]=all[a]||{cost:[],wall:[],turns:[],tok:[],inp:[],out:[]});
    all[a].cost.push(t.cost_usd||0);
    if(t.wall_s)all[a].wall.push(t.wall_s);
    all[a].turns.push(t.turns||0);
    if(t.tokens){all[a].tok.push(t.tokens);all[a].inp.push(t.input_tokens||0);all[a].out.push(t.output_tokens||0);} });
  // The historical bucket is a BASELINE, not an arm: those tickets predate the experiment and
  // predate changes to what the platform counts, so standing them beside a chosen arm invites the
  // one comparison that would be wrong. Reported on its own line, below the block.
  const arms={}; Object.keys(all).forEach(k=>{ if(k!=="pre_okf") arms[k]=all[k]; });
  _renderBaselineNote(all["pre_okf"]);
  const names=Object.keys(arms);
  // shown even with ONE arm: the baseline is the point of looking before OKF is switched on.
  // The delta stays hidden until there is something to compare, so nobody reads a number that
  // was never measured against anything.
  box.style.display=names.length?"block":"none";
  if(!names.length)return;
  const avg=xs=>xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null;
  $("#dKnowRows").innerHTML=names.sort().map(a=>{ const v=arms[a], n=v.cost.length;
    return `<tr><td>${_armBadge(a)}</td><td class="num">${n}</td>
      <td class="num">${_fmtTok(_med(v.tok))}</td>
      <td class="num">${_fmtTok(avg(v.tok))}</td>
      <td class="num sub">${_fmtTok(_med(v.inp))} / ${_fmtTok(_med(v.out))}</td>
      <td class="num">$${(_med(v.cost)||0).toFixed(2)}</td>
      <td class="num">${_fmtDur(_med(v.wall))}</td>
      <td class="num">${(avg(v.turns)||0).toFixed(1)}</td></tr>`; }).join("");
  _renderKnowledgeDelta(arms);
  _renderKnowledgeChart(arms);
}
// Cost AND tokens per arm, side by side on two axes. Two axes because they are different units
// and one would flatten the other into an invisible sliver — and BOTH are shown because cost is
// the number that gets asked about while tokens are the number the map actually moves (cost also
// simply does not exist for a harness that reports no price).
function _renderKnowledgeChart(arms){
  const el=$("#cKnow"); if(!el||!window.Chart)return;
  const names=Object.keys(arms).sort();
  if(_dc["cKnow"])_dc["cKnow"].destroy();
  _dc["cKnow"]=new Chart(el.getContext("2d"),{
    data:{labels:names.map(a=>_ARM_L[a]||a),datasets:[
      {type:"bar",label:"median cost / ticket",yAxisID:"y",backgroundColor:"#f0a54a",
       data:names.map(a=>+(_med(arms[a].cost)||0).toFixed(2))},
      {type:"bar",label:"median tokens / ticket",yAxisID:"y1",backgroundColor:"#5aa9e6",
       data:names.map(a=>Math.round(_med(arms[a].tok)||0))}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:"bottom",labels:{color:"#9aa",boxWidth:12,font:{size:11}}},
        tooltip:{callbacks:{afterLabel:c=>`n=${arms[names[c.dataIndex]].cost.length}`}}},
      scales:{
        x:{ticks:{color:"#888",font:{size:10}},grid:{color:"rgba(255,255,255,.05)"}},
        y:{position:"left",ticks:{color:"#f0a54a",callback:v=>"$"+v},
           grid:{color:"rgba(255,255,255,.05)"}},
        y1:{position:"right",ticks:{color:"#5aa9e6",callback:_fmtTok},grid:{display:false}}}}});
}
// The historical numbers, stated as reference and explicitly not as a comparison.
function _renderBaselineNote(b){
  const el=$("#dKnowBaseline"); if(!el)return;
  if(!b||!b.cost.length){ el.style.display="none"; return; }
  el.style.display="block";
  el.innerHTML=`<span class="sub">Before the A/B: <b>${b.cost.length}</b> tickets ran without the `
    +`map · <b>${_fmtTok(_med(b.tok))}</b> median tokens · <b>$${(_med(b.cost)||0).toFixed(2)}</b> `
    +`median. An order-of-magnitude reference — <b>not</b> comparable with the arms above: these `
    +`were measured before review repairs began to be counted, so they look cheaper than they `
    +`would have been.</span>`;
}
function _fmtTok(v){ if(v==null)return "—"; return v>=1e6?(v/1e6).toFixed(2)+"M":v>=1e3?Math.round(v/1e3)+"k":String(Math.round(v)); }
// Treatment vs its control, per measure, on MEDIANS. Arithmetic, not a verdict — it names the
// control it used so a reader can see what it was compared against.
function _renderKnowledgeDelta(arms){
  const box=$("#dKnowDelta"); if(!box)return;
  const t=arms["injected"], ctlName=["off","unavailable","pre_okf"].find(c=>arms[c]);
  if(!t||!ctlName){ box.style.display="none"; return; }
  const c=arms[ctlName];
  const rows=[["tokens","tok",_fmtTok],["cost","cost",v=>"$"+(v||0).toFixed(2)],
              ["time","wall",_fmtDur],["turns","turns",v=>(v||0).toFixed(1)]]
    .map(([label,key,fmt])=>{
      const base=_med(c[key]), got=_med(t[key]);
      if(!base||got==null)return "";
      const pct=(got-base)/base*100;
      const cls=pct<0?"b-ok":"b-err";
      return `<span class="badge ${cls}" style="margin-right:6px">${label} ${pct>0?"+":""}${pct.toFixed(1)}%</span>`;
    }).join("");
  if(!rows){ box.style.display="none"; return; }
  box.style.display="block";
  box.innerHTML=`${rows}<span class="sub"> with OKF vs <b>${esc(ctlName)}</b> (medians, n=${t.cost.length} vs ${c.cost.length})</span>`;
}

// scan the board's TO-DO right now — no issue numbers, no waiting for the poll tick.
// The engine (poller) already handles which issues exist, one-at-a-time, and dedup.

// Single-line strict (ADR-0010): act on a PARKED job holding the floor — 'resume' (re-run the
// fixed ticket / retry a rate-limit now) or 'skip' (free the floor, move the queue on).
// #68 — the human's answer to a PR waiting on them. Goes through the generic action route, so
// the panel adds NO capability of its own: merge/adjust/discard are rows in the action layer and
// this is a mapping onto them, exactly like actJob below.
//
// ADJUST IS FREE TEXT, which is the decided design: the human types what needs changing and it
// re-runs one pass on the SAME branch and PR — a person reading a diff has words a fixed option
// list cannot hold. (The reviewer's own findings belong beside this box and are not there yet: #149.)
//
// AND FREE TEXT NEEDS A BOX, not a `prompt()` (#150). MEASURED ON THE PILOT: a pasted paragraph
// arrived at the platform as its last twenty-six characters. `prompt()` is a single-LINE control,
// so a multi-line paste is at the browser's mercy — and nothing downstream can tell a mutilated
// instruction from a short one, because a short instruction is legitimate. An agent pass ran, at
// full price, on a fragment; the operator was told it succeeded, and it had. The count under the
// box is not decoration: it is the operator's own proof that what they pasted is what will be sent.
let _gate={};
function openAdjust(project,issue){
  _gate={project,issue};
  modal(`<h3>✏️ Adjust #${esc(issue)}</h3>
    <div class="muted">one more agent pass on the SAME branch and PR, against your own words</div>
    <label>What needs changing?</label>
    <textarea id="aj_text" rows="9" placeholder="e.g. &quot;the button should be on the right&quot;
e.g. &quot;this needs a test for the empty case&quot;

Paste as much as you need — this box keeps line breaks."></textarea>
    <div class="muted" id="aj_count" style="margin-top:6px">0 characters</div>
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn ghost" style="flex:1" onclick="closeModal()">Cancel</button>
      <button class="btn" style="flex:1" onclick="submitAdjust()">Send it back</button></div>`);
  // NO LIMIT NUMBER HERE ON PURPOSE. The action layer already refuses an over-long instruction
  // with a sentence that names the size and the ceiling, and this page repeating the ceiling
  // would be a second definition of it — the defect this whole panel spent a week removing. The
  // COUNT is the part only the browser can supply, and the part that would have caught #150.
  const t=$("#aj_text");
  t.addEventListener("input",()=>{
    const n=t.value.length;
    $("#aj_count").textContent=n+" character"+(n==1?"":"s")+" — all of it reaches the agent";
  });
  t.focus();
}
function submitAdjust(){
  const t=$("#aj_text").value;
  if(!t.trim()){toast("Nothing to send","say what needs changing","err");return}
  closeModal();
  mergeGate(_gate.project,_gate.issue,"adjust",t);
}
async function mergeGate(project,issue,answer,instruction){
  instruction=instruction||"";
  if(answer=="adjust"&&!instruction.trim()){openAdjust(project,issue);return}
  if(answer=="discard" && !confirm(`Discard #${issue}? The PR is closed without merging and the floor is freed.\n\nNothing is deleted — the branch and its commits stay, so this can be picked up again.`))return;
  const fc=$("#floorCtl");if(fc)fc.innerHTML='<span class="pill b-run"><span class="spin"></span> '+esc(answer)+'…</span>';
  try{
    const params={project,issue};
    if(instruction)params.instruction=instruction;
    const r=await mfetch(`/api/act/${encodeURIComponent(answer)}`,
      {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({params})});
    const d=await r.json().catch(()=>({}));
    // The Outcome's own sentence, always — it is written to be read by a person and it is the
    // only thing that knows whether the forge accepted the merge or merely started trying.
    const TOAST={merge:"Merging",adjust:"Sent back",review:"Reading it again",discard:"Discarded"};
    if(r.ok)toast(TOAST[answer]||answer,(d&&d.message)||"done","ok");
    else toast("Could not "+answer,(d&&d.detail)||"the gate did not accept that","err");
  }catch(e){toast("Error","could not answer the merge gate","err")}
  setTimeout(loadEngine,800);setTimeout(loadInbox,800);
}

async function actJob(project,issue,action,choice){
  if(action=="skip" && !confirm(`Skip #${issue}? This frees the floor and leaves the ticket for its owner (Backlog).`))return;
  const fc=$("#floorCtl");if(fc)fc.innerHTML='<span class="pill b-run"><span class="spin"></span> '+esc(choice?("choice "+choice):action)+'…</span>';
  try{
    const r=await mfetch(`/api/temporal/act/${encodeURIComponent(project)}/${encodeURIComponent(issue)}`,
      {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action,choice:choice||""})});
    const d=await r.json().catch(()=>({}));
    if(r.ok)toast(action=="resume"?"Resumed":"Skipped",action=="resume"?`#${issue} re-running`:`#${issue} skipped — floor free`,"ok");
    else toast("Action failed",(d&&d.detail)||"could not act","err");
  }catch(e){toast("Error","could not act on the job","err")}
  setTimeout(loadEngine,800);setTimeout(loadInbox,800);
}
function openRegister(){
  modal(`<h3>＋ New project</h3><div class="muted">register a project the factory can run</div>
    <label>Name</label><input id="np_name" placeholder="e.g. my-project">
    <label>Repo path</label><input id="np_path" placeholder="~/Projects/...">
    <label>Repo (owner/name)</label><input id="np_repo" placeholder="yourorg/yourrepo">
    <label>Board owner / number (optional)</label>
    <div class="verline"><input id="np_bo" placeholder="yourorg"><input id="np_bn" placeholder="1" style="max-width:90px"></div>
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn ghost" style="flex:1" onclick="closeModal()">Cancel</button>
      <button class="btn" style="flex:1" onclick="submitRegister()">Register</button></div>`);
}
async function submitRegister(){
  const b={name:np_name.value.trim(),repo_path:np_path.value.trim(),repo:np_repo.value.trim(),
    board_owner:np_bo.value.trim()||null,board_number:np_bn.value.trim()||null};
  if(!b.name||!b.repo_path){toast("Missing","name and repo path","err");return}
  const r=await mfetch("/api/projects",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});
  if(r.ok){closeModal();projects=await api("/api/projects").catch(()=>projects);render();toast(b.name,"project registered","ok")}
  else toast("Error","not registered (duplicate?)","err");
}
let _sug={};
async function openPromote(project,issue){
  let info={};try{info=await api(`/api/promote/${project}/${issue}`)}catch(e){info={}}
  _sug=info.suggestions||{};
  modal(`<h3>Promote to production</h3><div class="muted">${esc(project)} #${esc(issue)} → prod ${info.latest_tag?"(latest: "+esc(info.latest_tag)+")":""}</div>
    <label>Approver (login)</label><input id="pv_login" placeholder="your login">
    <label>Password</label><input id="pv_pass" type="password" placeholder="your password">
    <label>Version</label>
    <div class="verline"><input id="pv_ver" value="${esc((info.suggestions&&info.suggestions.patch)||"0.0.1")}">
      <div class="seg" id="pv_bump" style="margin:0">
        <button data-p="patch">patch</button><button data-p="minor">minor</button><button data-p="major">major</button></div></div>
    <label>Comment (optional)</label><textarea id="pv_comment" rows="2" placeholder="release notes"></textarea>
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn ghost" style="flex:1" onclick="closeModal()">Cancel</button>
      <button class="btn" style="flex:1" data-act="submitPromote" data-p="${esc(project)}" data-i="${esc(issue)}">Confirm release</button></div>`);
  document.querySelectorAll("#pv_bump button").forEach(b=>b.onclick=()=>{if(_sug[b.dataset.p])$("#pv_ver").value=_sug[b.dataset.p]});
}
async function submitPromote(project,issue){
  const b={approver:$("#pv_login").value.trim(),password:$("#pv_pass").value,version:$("#pv_ver").value.trim(),comment:$("#pv_comment").value.trim()};
  if(!b.approver||!b.password||!b.version){toast("Missing","approver, password and version","err");return}
  const r=await mfetch(`/api/temporal/approve/${project}/${issue}`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});
  if(r.ok){closeModal();toast(`${project} #${issue}`,"approval sent to the engine — releasing","ok");setTimeout(loadEngine,600);setTimeout(loadInbox,600)}
  else{const e=await r.json().catch(()=>({}));toast("Denied",(e&&e.detail)||"not authorized","err")}
}
function toast(title,msg,kind){
  const t=document.createElement("div");t.className="toast "+(kind||"");
  t.innerHTML=`<b>${esc(title)}</b><p>${esc(msg)}</p>`;$("#toasts").appendChild(t);
  setTimeout(()=>{t.classList.add("leave");setTimeout(()=>t.remove(),300)},4500);
}
boot();
</script>
