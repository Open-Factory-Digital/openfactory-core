<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__BRAND__</title>
<!-- THE TAB ICON, INLINE, for the same reason the header's mark is inline and the font is not
     fetched: this file is served by the client's own deployment, and a favicon requested from
     anywhere else is an outbound call from every operator's browser on a private network. A
     data-URI costs one attribute and never 404s.

     IT CARRIES ITS OWN GROUND on purpose. A favicon sits in browser chrome whose light/dark we
     do not control and cannot read — `prefers-color-scheme` decides nothing in this file, and
     here it *could* not: so the mark ships on its own amber badge and reads on either chrome,
     rather than as bare dots that vanish on one of them.

     The dots are r=9 rather than the header's r=8 — an optical correction, not a second mark: at
     16px each dot renders under 3px across, and the gap that reads as deliberate at 34px reads as
     mush at 16. Same six dots, same arrangement, same colours as `.brand .mark`. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 88 88'%3E%3Crect width='88' height='88' rx='20' fill='%23ff9f2e'/%3E%3Cg fill='%23160c00'%3E%3Ccircle cx='20' cy='20' r='9'/%3E%3Ccircle cx='44' cy='20' r='9'/%3E%3Ccircle cx='68' cy='20' r='9'/%3E%3Ccircle cx='20' cy='44' r='9'/%3E%3Ccircle cx='44' cy='44' r='9'/%3E%3Ccircle cx='20' cy='68' r='9'/%3E%3C/g%3E%3C/svg%3E">
<script>
// BEFORE THE FIRST PAINT, and that is the whole reason this sits in <head> as a blocking script
// rather than in the app's own boot. Applying the theme after the page renders means a light-mode
// operator gets a full flash of the dark control room on every single navigation — the kind of
// detail that reads as "unfinished" to somebody evaluating the product, and it cannot be fixed
// later in the file no matter how early the app starts.
//
// DARK IS THE DEFAULT, DELIBERATELY, and `prefers-color-scheme` is NOT consulted for it. This is a
// floor somebody keeps open all day; the product owner's call was the control room. The OS
// preference decides nothing here — an explicit choice does, and only that choice is remembered.
(function(){try{
  var t=localStorage.getItem("of_theme");
  if(t==="light")document.documentElement.setAttribute("data-theme","light");
}catch(e){/* private mode: the default stands, which is a working panel */}})();
</script>
<style>
:root{
  /* ─────────────────────────────────────────────────────────────────────────────────────────────
     OpenFactory — the panel's design tokens.

     TWO THEMES, BOTH DESIGNED. Dark is the default because this is a control room somebody keeps
     open all day; light exists because it is what the product's own site looks like and what a
     buyer recognises. Light is NOT the dark palette inverted — an inverted control room reads as
     a bug report. Each surface, line and state colour is chosen for its own ground.

     THE RULE THE SITE SETS, AND WHERE THIS DEPARTS FROM IT. `openfactory.digital` says of itself:
     "no colour beyond the brand's own — credibility here comes from precision, not decoration."
     That is right for a page you read and wrong for a floor you watch: an operator has to find a
     failing job across a screen without reading it. So colour here is SEMANTIC ONLY — four states
     and nothing else — and it never decorates. Amber is running, green is done, red is failed,
     blue is a link. There is no fifth.

     EVERY COLOUR IS A TOKEN. Seventeen literal hex values used to sit in the rules below, which
     is exactly seventeen places a light theme would have been broken and nobody would have
     noticed until a buyer switched it.
     ───────────────────────────────────────────────────────────────────────────────────────────── */

  /* structure — the brand kit's ink as the ground, its greys as the frame */
  --bg:#0B0F14;--floor:#0d1218;--panel:#11161d;--card:#151b23;--card2:#1b222c;
  --line:#232c38;--line2:#313d4d;
  --txt:#F5F5F5;--muted:#9aa5b4;--dim:#6B7280;
  --raised:#12141c;                 /* the header's ambient glow */
  --scroll:#232f42;
  --shadow:rgba(0,0,0,.55);
  --on-amber:#160c00;               /* text ON the amber fill — never white, it fails contrast */
  --track:#2a3648;                  /* an off switch */
  --knob:#ffffff;
  --mine:#173042;                   /* a message this operator sent */
  --avatar-a:#1c2740;--avatar-b:#26344f;--avatar-txt:#cdd9f2;
  --hairline:rgba(255,255,255,.012);

  /* state — semantic, never decorative */
  --amber:#ff9f2e;--amber-dim:#c9791f;--amber-glow:rgba(255,159,46,.30);
  --cyan:#4cc9f0;--ok:#3ddc84;--err:#ff5c6c;--purple:#a78bfa;
  /* soft washes of the same four states — a tinted SURFACE (a banner, a badge fill), never a new
     colour. Always paired with the solid token above for the text/dot that sits on it. */
  --amber-wash:rgba(255,159,46,.09);--err-wash:rgba(255,92,108,.10);--ok-wash:rgba(61,220,132,.10);
  --ring:rgba(76,201,240,.45);      /* focus ring — the link colour, at a visible weight */

  /* the site's own scale, so the two products measure the same */
  --s1:8px;--s2:16px;--s3:24px;--s4:40px;--s5:64px;
  --radius:6px;--radius-md:10px;--radius-lg:16px;--radius-xl:20px;--radius-full:999px;
  --max:1180px;                     /* denser than the site's 1120px, but never edge-to-edge */

  /* type scale — six sizes, named. A hardcoded px is a decision nobody else can see was made. */
  --t-xs:11px;--t-sm:12px;--t-md:14px;--t-lg:16px;--t-xl:20px;--t-2xl:28px;

  /* elevation — a card two steps up from the page reads as something to look AT, not just a
     region. Kept out of the light theme's own "no colour beyond the brand's own" instinct by
     staying pure black-alpha in both grounds — a shadow is cast light, not a fifth colour. */
  --shadow-1:0 1px 2px rgba(0,0,0,.45);
  --shadow-2:0 10px 24px -6px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);
  --shadow-3:0 28px 56px -16px rgba(0,0,0,.6),0 10px 24px -8px rgba(0,0,0,.4);
  --shadow-inset:inset 0 1px 0 rgba(255,255,255,.03);

  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Consolas",monospace;
  /* Inter FIRST, then the system stack. Deliberately NOT a Google Fonts <link>: the panel is a
     single self-contained file served by the deployment itself, and a webfont fetched from a
     third party turns every operator's page load into an outbound request to somebody else —
     which on a client's private network is both a leak and a hang. Inter renders where it is
     installed; the system face is a correct fallback everywhere else. */
  --ui:"Inter",-apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
}

/* LIGHT — the site's ground, and the state colours re-picked for it. The dark palette's amber and
   green are tuned to glow on near-black; on white they are illegible, so each state has its own
   value here rather than a filter over the other one. */
:root[data-theme="light"]{
  --bg:#FFFFFF;--floor:#FFFFFF;--panel:#FFFFFF;--card:#FFFFFF;--card2:#F5F5F5;
  --line:#E9EBEE;--line2:#D1D5DB;
  --txt:#0B0F14;--muted:#4B5563;--dim:#6B7280;
  --raised:#F7F8FA;
  --scroll:#D1D5DB;
  --shadow:rgba(11,15,20,.14);
  --on-amber:#FFFFFF;
  --track:#D1D5DB;
  --knob:#FFFFFF;
  --mine:#EEF3FA;
  --avatar-a:#E9EBEE;--avatar-b:#D1D5DB;--avatar-txt:#1A2029;
  --hairline:rgba(11,15,20,.020);

  --amber:#B45309;--amber-dim:#92400E;--amber-glow:rgba(180,83,9,.18);
  --cyan:#1D4ED8;--ok:#047857;--err:#B91C1C;--purple:#6D28D9;
  --amber-wash:rgba(180,83,9,.07);--err-wash:rgba(185,28,28,.06);--ok-wash:rgba(4,120,87,.07);
  --ring:rgba(29,78,216,.32);

  --shadow-1:0 1px 2px rgba(11,15,20,.05);
  --shadow-2:0 8px 20px -6px rgba(11,15,20,.09),0 2px 6px rgba(11,15,20,.05);
  --shadow-3:0 30px 54px -18px rgba(11,15,20,.16),0 10px 22px -8px rgba(11,15,20,.07);
  --shadow-inset:inset 0 1px 0 rgba(11,15,20,.02);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:
    repeating-linear-gradient(90deg,var(--hairline) 0 1px,transparent 1px 88px),
    radial-gradient(1100px 520px at 82% -12%,var(--raised) 0,var(--bg) 60%);
  color:var(--txt);font:var(--t-md)/1.5 var(--ui);-webkit-font-smoothing:antialiased}
a{color:var(--cyan);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.13em;color:var(--dim);font-weight:700}

/* `--raised` is defined as exactly this — a surface one step off the page ground — so the header
   reads correctly in EITHER theme instead of staying a literal dark bar while the page around it
   goes white. A hardcoded rgba() here was the bug: light theme's --txt is near-black, and near-
   black text on an unconditionally near-black header is ~1.3:1 contrast — reads as "gone", not
   "dark theme header, oops". */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--raised) 92%,transparent);
  backdrop-filter:blur(9px);border-bottom:1px solid var(--line);box-shadow:var(--shadow-1)}
.brand-row{display:flex;align-items:center;gap:24px;padding:16px 22px;max-width:var(--max);margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
/* The mark's dots sit ON the amber-gradient badge, not on the page — so they take `--on-amber`,
   the token this file already defines for exactly that ("text ON the amber fill — never white, it
   fails contrast"), not `--txt` (the PAGE's foreground, which is near-black in light theme and
   rendered the dots almost invisible against their own dark-amber badge). Hover brightens the
   badge instead of recolouring the dots into the same family as their own background — the old
   `fill:var(--amber)` on hover matched the badge's OWN colour and made them vanish on purpose. */
.brand .mark svg circle{fill:var(--on-amber)}
.brand:hover .mark{filter:brightness(1.15);transform:translateY(-1px) scale(1.04)}
.brand .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:linear-gradient(150deg,var(--amber),var(--amber-dim));box-shadow:0 4px 14px -4px var(--amber-glow);
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease,filter .18s ease}
.wordmark{display:block;font-size:var(--t-lg);font-weight:800;letter-spacing:-.01em}
.tagline{display:block;color:var(--dim);font-weight:600;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;margin-top:2px}
.spacer{flex:1}
/* the pill: a small control (live / theme / cost), never a status of its own — the floor's
   status now lives in the banner below, at a weight nothing else in the header competes with. */
.pill{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-sm);color:var(--muted);font-weight:600;
  padding:8px 14px;border:1px solid var(--line);border-radius:var(--radius-full);background:var(--card2);
  transition:background .15s ease,border-color .15s ease,transform .15s ease}
.pill:hover{background:var(--raised);border-color:var(--line2);transform:translateY(-1px)}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.pill.on .d{background:var(--ok)}

/* the floor statement — ONE element, three levels. `lvl-ok` is genuinely colourless (a hollow
   dot, body-weight text): the graft from the "precision" exploration that a healthy floor should
   cost zero visual attention, stronger than merely "muted colour". `lvl-warn`/`lvl-err` wash the
   full width of the banner rather than only recolouring text — a surface changes, not a word. */
.statusbar{padding:20px 22px;border-top:1px solid var(--line);transition:background .2s ease}
.statusbar .inner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:var(--max);margin:0 auto}
.statusbar .dot{width:9px;height:9px;border-radius:50%;flex:none}
.statusbar .txt{font-size:var(--t-2xl);font-weight:650;letter-spacing:-.015em;line-height:1.3}
.statusbar.lvl-ok .dot{background:transparent;border:1.5px solid var(--dim)}
.statusbar.lvl-ok .txt{color:var(--txt)}
.statusbar.lvl-warn{background:var(--amber-wash)}
.statusbar.lvl-warn .dot{background:var(--amber);box-shadow:0 0 0 4px var(--amber-wash)}
.statusbar.lvl-warn .txt{color:var(--amber);font-size:var(--t-xl);font-weight:700}
.statusbar.lvl-err{background:var(--err-wash)}
.statusbar.lvl-err .dot{background:var(--err);box-shadow:0 0 0 4px var(--err-wash)}
.statusbar.lvl-err .txt{color:var(--err);font-size:var(--t-xl);font-weight:700}
/* THE DEPLOYMENT DISAGREES WITH ITSELF (#135). Loud on purpose and it cannot be dismissed: unlike
   every other warning here, this one says the SCREEN is unreliable, so it must not be dressed like
   the statements it is casting doubt on. Its own `<code>` colour, because the rest of the page's
   monospace inherits a level colour this banner does not have. */
.buildsplit{padding:16px 22px;background:var(--err-wash);border-top:1px solid var(--err);
  color:var(--err);font-size:var(--t-sm);line-height:1.55;max-width:none}
.buildsplit code{font-family:var(--mono);font-size:.9em;font-weight:600;background:transparent;
  color:inherit;word-break:break-all}
/* WAITING ON A CLOCK is flat, like healthy — because it IS healthy: a machine-owned wait that
   clears itself needs nobody. Its dot is solid rather than hollow, which is the whole visual
   difference between "nothing to do" and "something is happening without you". */
.statusbar.lvl-clock .dot{background:var(--dim);border:none}
.statusbar.lvl-clock .txt{color:var(--txt)}
/* UNKNOWN IS NOT A LEVEL OF BAD, it is an absence of knowledge — so it gets neither the green
   calm nor the red alarm, but a dashed edge: the instrument is dark. */
.statusbar.lvl-unknown{background:transparent;border-top:1px dashed var(--line2)}
.statusbar.lvl-unknown .dot{background:transparent;border:1.5px dashed var(--muted)}
.statusbar.lvl-unknown .txt{color:var(--muted)}
/* The demoted causes. Deliberately small and quiet: they are the remainder of a sentence, not a
   second banner competing with the first. */
.floorAlso{display:flex;flex-direction:column;gap:2px;padding:0 22px 14px;max-width:var(--max);
  margin:0 auto}
.floorAlso .alsorow{font-size:var(--t-sm);color:var(--muted);line-height:1.5}
.floorAlso .alsorow.lvl-err{color:var(--err)}
.floorAlso .alsorow.lvl-warn{color:var(--amber)}
/* the remediation command, when the floor names one — inherits the level's own colour rather
   than a colour of its own, so it reads as "part of this sentence", amber under a held project
   and red under an unreachable engine. */
.statusbar .cmd{font-family:var(--mono);font-size:.82em;font-weight:600;color:inherit;
  background:color-mix(in srgb,currentColor 14%,transparent);
  border:1px solid color-mix(in srgb,currentColor 30%,transparent);
  padding:2px 8px;border-radius:6px;white-space:nowrap}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--amber-glow)}70%{box-shadow:0 0 0 7px rgba(255,159,46,0)}100%{box-shadow:0 0 0 0 rgba(255,159,46,0)}}

.wrap{max-width:var(--max);margin:0 auto;padding:26px 24px 60px}
.crumbs{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:var(--t-sm);margin-bottom:20px}
.crumbs a{color:var(--muted);cursor:pointer}
/* a real heading, not a small-caps label — the editorial exploration's graft. The underline
   marker is the SAME device as its own "recommended" amber, so it reads as one system rather
   than a second accent colour. Scoped to `.sechead .lbl` — the bare `.lbl` used standalone (the
   cockpit's gauge labels) keeps its original small-caps treatment. */
.sechead{display:flex;align-items:center;gap:14px;margin:var(--s5) 0 var(--s3)}
.sechead:first-child{margin-top:0}
.sechead .lbl{flex:none;font-size:var(--t-xl);font-weight:750;letter-spacing:-.01em;
  text-transform:none;color:var(--txt);position:relative;padding-bottom:2px}
.sechead .lbl::after{content:"";position:absolute;left:0;bottom:-6px;width:26px;height:2px;
  background:var(--amber);border-radius:2px}
.sechead .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.sechead .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;
  padding:0 7px;font:800 var(--t-xs) var(--mono);color:var(--amber);background:var(--amber-wash);
  border:1px solid var(--amber-glow);border-radius:var(--radius-full)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border:0;border-radius:9px;cursor:pointer;
  background:linear-gradient(135deg,var(--amber),var(--amber-dim));color:var(--on-amber);font-weight:800;font-size:var(--t-md);
  box-shadow:0 5px 18px var(--amber-glow);transition:.15s}
.btn:hover{filter:brightness(1.07)}.btn:disabled{opacity:.55;cursor:default;box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--muted);box-shadow:none;font-weight:700}
.btn.ghost:hover{border-color:var(--cyan);color:var(--txt)}
/* a third, quieter tier — for an action that ends something (Discard) rather than advances it.
   No border, no fill: it earns attention only on hover, and only ever as an alarm colour. */
.btn.plain{background:transparent;border:1px solid transparent;color:var(--muted);box-shadow:none;font-weight:700}
.btn.plain:hover{color:var(--err);background:var(--err-wash)}
.btn.sm{padding:6px 11px;font-size:var(--t-sm)}
.spin{width:14px;height:14px;border:2px solid rgba(0,0,0,.35);border-top-color:var(--on-amber);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
/* ── tech-lead chat: the standard floating widget ─────────────────────────────────────── */
.chatfab{position:fixed;right:26px;bottom:26px;width:56px;height:56px;border-radius:50%;border:1px solid var(--line2);
  background:var(--card2);color:var(--txt);font-size:24px;cursor:pointer;z-index:60;display:flex;align-items:center;
  justify-content:center;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.chatfab:hover{border-color:var(--cyan)}
.chatfab .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--err);
  color:var(--knob);font:700 var(--t-xs)/20px var(--ui);text-align:center;padding:0 5px}
.chatpanel{position:fixed;right:26px;bottom:96px;width:400px;max-width:calc(100vw - 40px);height:min(62vh,640px);
  background:var(--panel);border:1px solid var(--line2);border-radius:14px;z-index:60;display:none;flex-direction:column;
  box-shadow:0 18px 60px rgba(0,0,0,.55);overflow:hidden}
.chatpanel.open{display:flex}
.chathead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.chathead b{font-size:var(--t-md)}
.chathead .sub{font-size:var(--t-xs);color:var(--muted)}
.chatlog{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:9px 12px;border-radius:12px;font-size:var(--t-md);white-space:pre-wrap;word-break:break-word}
.msg.tl{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--mine);border:1px solid var(--line2);border-bottom-right-radius:4px}
.msg .sub{margin-top:4px;font-size:var(--t-xs);color:var(--dim)}
.msg .opts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chatin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--card)}
.chatin input{flex:1;font-family:var(--ui);padding:9px 12px}
.chip{font:600 var(--t-xs) var(--ui);color:var(--muted);border:1px solid var(--line2);background:var(--card2);
  border-radius:var(--radius-full);padding:5px 10px;white-space:nowrap}
/* A CHIP THAT CARRIES A VERDICT NEEDS A COLOUR, or four different states render identically and
   the badge says nothing it did not already say by existing. `unknown` stays deliberately grey:
   it is not a fourth severity, it is the absence of an answer, and painting it amber would make
   "we could not read the proof" look like "the proof expired". */
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.chip.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 45%,transparent)}
.chip.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.chip.dim{color:var(--dim);border-style:dashed}

/* ZONE A — 'needs you'. An amber edge bar (the same device the busy/held project cards use)
   marks EVERY row the same way, because every row here is the same kind of fact: something is
   waiting on a human. Elevated like something worth looking AT, not just a region of the page. */
.needs-list{display:flex;flex-direction:column;gap:14px;margin-bottom:8px}
.needs-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-xl);
  padding:22px 26px;box-shadow:var(--shadow-2),var(--shadow-inset);
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;overflow:hidden;
  transition:box-shadow .2s ease,transform .2s ease,border-color .2s ease}
.needs-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--amber),var(--amber-dim))}
.needs-card:hover{box-shadow:var(--shadow-3),var(--shadow-inset);transform:translateY(-2px);border-color:var(--line2)}
/* the queue's own order, named — a lightweight priority signal a bare list doesn't have. Tabular
   so a two-digit queue still aligns. */
.needs-num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:var(--t-sm);
  font-weight:700;color:var(--dim);flex:none;padding-top:2px}
.needs-body{flex:1 1 360px;min-width:0}
.needs-kicker{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--amber);background:var(--amber-wash);border:1px solid var(--amber-glow);
  padding:3px 8px;border-radius:5px;margin-bottom:10px}
.needs-title{font-size:var(--t-lg);font-weight:700;letter-spacing:-.005em;color:var(--txt)}
.needs-title .sep{color:var(--dim);font-weight:500;margin:0 2px}
.needs-sub{margin:5px 0 0;font-size:var(--t-sm);color:var(--muted)}
.needs-actions{display:flex;gap:10px;flex:0 0 auto;flex-wrap:wrap}

/* cockpit — per-project observability (read-only, links out to everything) */
.cockpit{background:linear-gradient(180deg,var(--card),var(--panel));border:1px solid var(--line);
  border-radius:13px;padding:16px 18px;margin-bottom:8px}
.cockpit .rowg{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.cockpit .gauge{display:flex;flex-direction:column;gap:3px}
.cockpit .gauge b{font:700 var(--t-md) var(--mono);color:var(--txt)}
.cockpit .gauge small{color:var(--dim);font-weight:400}
.cockpit .dots{color:var(--amber);letter-spacing:2px}
.cockpit .grow{flex:1;min-width:20px}
.cockpit .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.jump{font:600 var(--t-sm) var(--ui);color:var(--cyan);border:1px solid var(--line2);border-radius:7px;
  padding:6px 11px;white-space:nowrap;transition:.15s}
.jump:hover{border-color:var(--cyan);text-decoration:none;background:color-mix(in srgb,var(--cyan) 7%,transparent)}
.jump.off{color:var(--dim);border-color:var(--line);pointer-events:none;opacity:.5}

/* project cards on the index */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.proj{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--line);
  border-radius:var(--radius-xl);padding:22px;cursor:pointer;position:relative;
  box-shadow:var(--shadow-2),var(--shadow-inset);
  transition:box-shadow .2s ease,transform .2s ease,border-color .2s ease}
.proj:hover{border-color:var(--line2);transform:translateY(-3px);box-shadow:var(--shadow-3),var(--shadow-inset)}
/* STATE FIRST, in the eye's path: the top edge is the one place colour appears unconditionally,
   so an operator scans a whole grid of these for the one that is wrong without reading any of
   them. `held` wins over `busy` — a job can still be finishing on a box that has since expired,
   and that is the more urgent fact (the NEXT card will not be picked up). */
.proj.busy{border-top-color:var(--amber)}
.proj.held{border-top-color:var(--err)}
.proj .top{display:flex;align-items:flex-start;gap:11px}
.proj .ic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font:800 var(--t-md) var(--mono);
  background:linear-gradient(135deg,var(--avatar-a),var(--avatar-b));color:var(--avatar-txt);flex:none}
.proj h3{margin:0;font-size:var(--t-lg);font-weight:750}
.proj .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.proj .stat{display:flex;align-items:center;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.proj .stat div{font-size:var(--t-sm);color:var(--dim)}
/* the badge — a compact, coloured verdict beside the name, so "which one is wrong" resolves
   before the eye even reaches the detail line below it. */
.proj-status{display:inline-flex;align-items:center;gap:6px;flex:none;margin-left:auto;
  font-size:var(--t-xs);font-weight:750;letter-spacing:.02em;text-transform:uppercase;
  padding:5px 10px;border-radius:var(--radius-full)}
.proj-status .dot{width:6px;height:6px;border-radius:50%;flex:none}
.proj-status.st-held{background:var(--err-wash);color:var(--err);border:1px solid color-mix(in srgb,var(--err) 28%,transparent)}
.proj-status.st-held .dot{background:var(--err)}
.proj-status.st-running{background:var(--amber-wash);color:var(--amber);border:1px solid var(--amber-glow)}
.proj-status.st-running .dot{background:var(--amber);animation:pulse 2.2s infinite}
.proj-status.st-idle{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:700}
.proj-status.st-idle .dot{background:transparent;border:1.5px solid var(--dim)}
.sw{width:38px;height:21px;border-radius:20px;background:var(--track);position:relative;cursor:pointer;transition:.2s;flex:none}
.sw.on{background:var(--ok)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--knob);transition:.2s}
.sw.on::after{left:19px}

/* the active machine (focused running job) */
.machine{background:radial-gradient(600px 200px at 15% -30%,color-mix(in srgb,var(--amber) 6%,transparent),transparent),var(--card);
  border:1px solid color-mix(in srgb,var(--amber) 32%,transparent);border-radius:15px;padding:20px;position:relative;overflow:hidden;margin-bottom:12px}
.machine::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--amber),transparent);background-size:200% 100%;animation:sweep 1.4s linear infinite}
@keyframes sweep{to{background-position:-200% 0}}
.mtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mtop h2{margin:0;font-size:var(--t-xl)}
.mtop .tick{color:var(--dim);font-family:var(--mono)}
.mtop .grow{flex:1}
.tel{display:flex;gap:26px;margin:16px 0 4px;flex-wrap:wrap}
.tel .t{min-width:96px}
.tel .t .k{font-size:var(--t-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
.tel .t .v{font:800 var(--t-xl) var(--mono);color:var(--txt);margin-top:3px}
.tel .t .v.amber{color:var(--amber)}.tel .t .v.small{font-size:var(--t-md);font-weight:700}

.pipe{display:flex;align-items:flex-start;margin:20px 0 8px}
.stn{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:62px}
.stn .node{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
  border:1.5px solid var(--line2);background:var(--bg);color:var(--dim);font:700 var(--t-md) var(--mono);transition:.3s;z-index:2}
.stn span{font-size:var(--t-xs);color:var(--dim);text-transform:uppercase;letter-spacing:.06em;transition:.3s}
.stn.done .node{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 14%,transparent);color:var(--cyan)}
.stn.done span{color:var(--muted)}
.stn.act .node{border-color:var(--amber);color:var(--amber);background:color-mix(in srgb,var(--amber) 10%,transparent);animation:ring 1.6s infinite}
.stn.act span{color:var(--amber);font-weight:700}
.stn.err .node{border-color:var(--err);color:var(--err)}.stn.err span{color:var(--err)}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--amber-glow)}70%{box-shadow:0 0 0 9px rgba(255,159,46,0)}100%{box-shadow:0 0 0 0 rgba(255,159,46,0)}}
.belt{flex:1;height:2px;background:var(--line2);margin-top:17px;position:relative;overflow:hidden}
.belt.fill{background:var(--cyan)}
.belt.flow::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--amber),transparent);
  background-size:200% 100%;animation:sweep 1.1s linear infinite}
.left{font-size:var(--t-sm);color:var(--muted);margin-top:6px}
.left b{color:var(--amber)}

/* THE LOGS PAGE. Two columns on a desktop and one on anything narrow — a log is read, so it gets
   the height of the window rather than the height of a dialog. */
.logsgrid{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:18px;align-items:start}
@media (max-width:900px){.logsgrid{grid-template-columns:1fr}}
.logfilters{display:flex;gap:8px;margin-bottom:10px}
.logfilters input{flex:1;min-width:0;font-family:var(--ui);padding:7px 11px}
.logfilters select{font-family:var(--ui);padding:7px 9px;background:var(--card2);color:var(--txt);
  border:1px solid var(--line2);border-radius:8px}
.logrow{cursor:pointer}
.logrow.on{border-color:color-mix(in srgb,var(--cyan) 55%,transparent);
  background:color-mix(in srgb,var(--cyan) 7%,transparent)}
.logfeed{max-height:calc(100vh - 320px);min-height:240px;border-top:none;margin-top:0;padding-top:0}
.feed{max-height:38vh;overflow:auto;border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.ev{display:flex;gap:10px;align-items:baseline;padding:4px 4px;border-radius:6px;animation:fade .28s ease}
.ev:hover{background:var(--card2)}
.ev time{font-family:var(--mono);font-size:var(--t-xs);color:var(--dim);min-width:56px}
.ev .k{font:700 var(--t-xs) var(--mono);padding:1px 6px;border-radius:4px;text-transform:uppercase;min-width:66px;text-align:center;letter-spacing:.03em}
.k-state{background:color-mix(in srgb,var(--cyan) 14%,transparent);color:var(--cyan)}
.k-agent_action{background:color-mix(in srgb,var(--purple) 14%,transparent);color:var(--purple)}
.k-validation{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.k-review{background:color-mix(in srgb,var(--cyan) 14%,transparent);color:var(--cyan)}
.k-pr{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.k-note{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted)}
.k-warning{background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--amber)}
.k-error{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.ev .msg{font-family:var(--mono);font-size:var(--t-sm);color:var(--txt);word-break:break-word}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.row{display:flex;align-items:center;gap:13px;padding:12px 15px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);margin-bottom:8px;transition:.15s}
.row:hover{border-color:var(--line2)}
.row .tk{font:700 var(--t-md) var(--mono);color:var(--txt);min-width:54px}
.row .grow{flex:1;min-width:0}
.row .sub{font-size:var(--t-xs);color:var(--dim);margin-top:2px}
.badge{font:700 var(--t-xs) var(--ui);padding:3px 10px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.b-run{background:color-mix(in srgb,var(--amber) 13%,transparent);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 30%,transparent)}
.b-ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.b-err{background:color-mix(in srgb,var(--err) 13%,transparent);color:var(--err);border-color:color-mix(in srgb,var(--err) 30%,transparent)}
.b-dim{background:color-mix(in srgb,var(--muted) 10%,transparent);color:var(--muted);border-color:var(--line2)}
/* EMITTED SINCE THE PILL EXISTED, DEFINED BY NOBODY (#139). `streamStatus` sets `pill b-warn` for
   a degraded transport, and there was no such rule — so the one state meant to stand out rendered
   flatter than the healthy one it was warning about. Amber, like every other warning here. */
.b-warn{background:var(--amber-wash);color:var(--amber);border-color:var(--amber-glow)}

.empty{color:var(--dim);text-align:center;padding:42px 20px;border:1px dashed var(--line2);border-radius:13px;line-height:1.7}
.empty .big{font-size:26px;margin-bottom:6px}
.sk{height:96px;border-radius:13px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));
  background-size:200% 100%;animation:sweep 1.4s linear infinite;margin-bottom:12px}

#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:50}
.toast{min-width:250px;max-width:340px;background:var(--card2);border:1px solid var(--line2);border-left:3px solid var(--amber);
  border-radius:10px;padding:11px 13px;box-shadow:0 12px 30px -8px var(--shadow);animation:slideIn .3s ease;position:relative;overflow:hidden}
.toast.ok{border-left-color:var(--ok)}.toast.err{border-left-color:var(--err)}
.toast b{display:block;font-size:var(--t-md)}.toast p{margin:2px 0 0;font-size:var(--t-sm);color:var(--muted)}
.toast.leave{animation:slideOut .3s ease forwards}
@keyframes slideIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(28px)}}
.needs-review{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.needs-review .rv-clause{color:var(--dim);font-size:var(--t-sm);line-height:1.45}
.needs-review .rv-points{flex:1 1 100%;margin:2px 0 0;padding-left:18px;color:var(--dim);font-size:var(--t-sm);line-height:1.5}
.needs-review .rv-points li{margin:2px 0}
.sg-param{flex:1 1 100%;color:var(--dim);font-size:var(--t-sm);line-height:1.5;margin-bottom:4px}
#modal{position:fixed;inset:0;background:rgba(3,5,9,.66);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:60}
.mbox{background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:22px;width:400px;box-shadow:0 24px 60px -12px var(--shadow);animation:fade .2s ease}
.mbox h3{margin:0 0 4px}.mbox .muted{font-size:var(--t-xs);color:var(--muted)}
label{display:block;font-size:var(--t-xs);color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line2);
  border-radius:8px;padding:9px 10px;font:var(--t-md) var(--mono);outline:none;transition:.15s}
textarea{font-family:var(--ui);resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-glow)}
.seg{display:flex;gap:6px;margin-top:4px}
.seg button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--muted);cursor:pointer;font-size:var(--t-sm)}
.seg button.sel{background:var(--amber);border-color:var(--amber);color:var(--on-amber);font-weight:700}
.verline{display:flex;gap:8px;align-items:center}
/* cost dashboard (full-screen) */
#dash{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:20px 24px 40px}
#dash .dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
#dash h2{font-size:18px;margin:0}
#dash .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:6px 0 16px;padding:12px;border:1px solid var(--line2);border-radius:12px;background:var(--card)}
#dash .filters label{display:flex;flex-direction:column;gap:3px;font-size:var(--t-xs);color:var(--muted)}
#dash .filters select,#dash .filters input{padding:6px 8px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--txt);font-size:var(--t-md)}
#dash .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
#dash .tile{border:1px solid var(--line2);border-radius:12px;padding:14px 16px;background:var(--card)}
#dash .tile .k{font-size:var(--t-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
#dash .tile .v{font-size:26px;font-weight:800;margin-top:4px;color:var(--txt)}
#dash .charts{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin-bottom:18px}
@media(max-width:900px){#dash .charts{grid-template-columns:1fr}}
#dash .chartbox{border:1px solid var(--line2);border-radius:12px;padding:12px;background:var(--card);min-height:220px}
#dash .chartbox .k{font-size:var(--t-sm);color:var(--muted);margin-bottom:8px}
#dash table{width:100%;border-collapse:collapse;font-size:var(--t-md)}
#dash th{text-align:left;color:var(--muted);font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.5px;padding:8px;border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap}
#dash td{padding:8px;border-bottom:1px solid var(--line);color:var(--txt)}
#dash tr:hover td{background:rgba(255,255,255,.03)}
#dash .num{text-align:right;font-variant-numeric:tabular-nums}

  /* the how-to under the project bar: closed by default, so it explains without shouting.
     Sizes come from the SCALE (--t-*), never from literals: six named sizes are a decision the
     panel made once, and thirty-four px values are thirty-four nobody made together. */
  details.howto{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  details.howto summary{cursor:pointer;color:var(--cyan);font-size:var(--t-sm);letter-spacing:.04em}
  details.howto dl{margin:10px 0 0;font-size:var(--t-sm);line-height:1.55}
  details.howto dt{color:var(--amber);margin-top:10px;text-transform:uppercase;
                   letter-spacing:.06em;font-size:var(--t-xs)}
  details.howto dd{margin:3px 0 0;opacity:.85}
  details.howto code{background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px}
  details.howto .dim{opacity:.6;margin-top:12px;font-size:var(--t-sm)}
</style>
</head>
<body>
<header class="top">
  <div class="brand-row">
    <div class="brand" onclick="go('/')">
      <div class="mark" aria-hidden="true">
        <!-- The brand kit's dotted 'F', inlined. An <img> would be a second request for 380 bytes
             and would break the moment this file is served from anywhere but its own origin. -->
        <svg viewBox="8 8 72 72" width="20" height="20">
          <circle cx="20" cy="20" r="8"/><circle cx="44" cy="20" r="8"/><circle cx="68" cy="20" r="8"/>
          <circle cx="20" cy="44" r="8"/><circle cx="44" cy="44" r="8"/><circle cx="20" cy="68" r="8"/>
        </svg>
      </div>
      <div><span class="wordmark">__BRAND__</span><span class="tagline">lights-out software floor</span></div>
    </div>
    <div class="spacer"></div>
    <!-- WHETHER THIS PAGE IS BEING PUSHED TO, or is falling back to asking. A panel that silently
         stopped receiving looks exactly like a quiet factory, which is the one confusion this
         product exists to remove — so the transport says which of the two it is. -->
    <div class="pill" id="live" style="display:none"><span class="d"></span><span id="liveTxt">…</span></div>
    <!-- The control room is the default; light is what the product's own site looks like and what a
         buyer recognises. Both are designed palettes, not one inverted. -->
    <button class="pill" id="theme" title="switch between the control room and the light theme"
            onclick="toggleTheme()" aria-label="switch theme"><span id="themeTxt">light</span></button>
    <div class="pill" id="costs" title="cost telemetry — spend by period / model / harness" onclick="openCosts()" style="cursor:pointer"><span class="d"></span><span>cost</span></div>
  </div>
  <!-- ZONE B — 'is the factory working?', collapsed to ONE statement. Six pills of identical
       weight used to answer this (engine / plant / intake / ghrate / decisions / alarm) — the one
       that meant a human was blocked read exactly like the one that almost always is true. Now
       `floorStatement()` composes the same reads into one sentence with a precedence order; the
       detail is still there, on hover. Healthy is quiet: no colour, no glow, no animation — the
       whole banner stays a flat surface and the dot stays hollow. -->
  <div class="statusbar" id="floor"><div class="inner"><span class="dot"></span><span class="txt" id="floorTxt">reading the floor…</span></div></div>
  <!-- The causes the headline demoted. Empty and hidden whenever there is only one thing to say,
       which on a healthy deployment is always — the old header named ONE held project and never
       mentioned that two others were held too. -->
  <div class="floorAlso" id="floorAlso" style="display:none"></div>
  <!-- INSIDE the header, so it is on every screen and above every view: a page from the wrong build
       makes every statement under it suspect, including the floor line right above. Hidden until the
       split is proven — see `paintBuildSplit`. -->
  <div class="buildsplit" id="buildsplit" style="display:none"></div>
</header>

<div class="wrap" id="app"><div class="sk"></div><div class="sk"></div></div>

<div id="modal"></div>
<div id="dash"></div>
<div id="toasts"></div>

<script>
// stations of the production line (the pipeline). ADR-0014: a single-agent project has no
// separate planner, so the Plan station is dropped (it would otherwise show a misleading ✓).
const STN_FULL=[
  ["spec_validation","Spec","Spec check — the ticket must have an objective + acceptance criteria (else it goes to needs-refinement)"],
  ["preparing","Prep","Prepare — clone the repo into an isolated sandbox and set it up"],
  ["planning","Plan","Plan — a dedicated read-only planner drafts a short, testable plan (two-stage projects only)"],
  ["implementing","Code","Code — the agent implements with TDD (test-first); in single-agent mode it plans inline first"],
  ["validating","Test","Validate — the platform runs the project's own gates: lint · security · type · tests · migrations"],
  ["reviewing","Review","Review — an independent pass over the diff (advisory by default: posts a PR comment, doesn't block)"],
  ["pr_open","PR","PR — open the pull request (auto-merges when green + policy allows)"]];
let STN=STN_FULL.slice();
function applyPipelineShape(single){
  STN = single ? STN_FULL.filter(s=>s[0]!="planning") : STN_FULL.slice();
}
// TERMINAL-GOOD, AND `pr_open` IS NOT ONE OF THEM (#148). A pull request that is open and waiting
// for a human has not shipped — it is the single most common thing on this floor that NEEDS
// somebody. With it in here the machine card printed `CURRENT STATION: shipped` directly beneath
// a header reading `Needs you`, which is the contradiction #141 removed, surviving in a set
// literal two surfaces still shared.
const SHIPPED=new Set(["merged","done"]);
//: The same question, asked by the badge painter. It carried its OWN copy of the list — so
//: fixing one would have left the other calling an open PR green.
const SHIPPED_BADGE=SHIPPED;
// THE SERVER OWNS THESE WORDS (#164). `__VOCABULARY__` is substituted when the page is served,
// from the engine's own lists — this file used to carry hand copies, and `ALARM` had already
// drifted: it was missing `paused` AND `awaiting_prod_approval`, so the bar that counts what needs
// a person did not count a production release gate.
const VOCAB=__VOCABULARY__;
const ALARM=new Set(VOCAB.alarm);
// plain-language "what's happening now" for each state — the headline of the machine card
const NOW={sizing:"Pre-flight — sizing the ticket (INVEST: one small, testable outcome?)",
  splitting:"Splitting — creating the sub-tickets & closing the parent",
  spec_validation:"Checking the spec (objective + acceptance criteria)",
  preparing:"Cloning the repo & preparing the sandbox",
  planning:"Planning — the planner is drafting a testable plan (read-only)",
  implementing:"Coding — the executor is implementing the plan (TDD)",
  validating:"Running the gates — lint · security · type · tests · migrations",
  repairing:"Repairing — fixing a gate that failed",
  reviewing:"Reviewing the diff (independent pass)",
  pr_open:"Pull request opened ✓",merged:"Merged ✓",
  needs_refinement:"Needs refinement — the spec is too weak",
  on_hold:"On hold — needs a human",
  paused:"Paused — rate-limited, will resume on its own",
  awaiting_your_merge:`PR ready — ${VOCAB.merge_wait.human}`,
  merging:`Auto-merge armed — ${VOCAB.merge_wait.auto}`,
  awaiting_prod_approval:"Awaiting your production approval"};
// clear, short label per event kind
const KLABEL={state:"STAGE",agent_action:"AGENT",validation:"GATE",review:"REVIEW",
  pr:"PR",note:"NOTE",warning:"WARN",error:"ERROR"};
let projects=[],engine={connected:false,jobs:[]},sandbox="fargate",es=null,focus=null,engineES=null;
//: WHEN the engine object was last written, and whether THIS PAGE failed to ask (#139). Two
//: different facts that the header used to conflate into one: "the engine is unreachable" was
//: printed both when Temporal was down and when the browser's own fetch failed.
let _engineAt=0,_engineErr="";
//: When this page started asking. A first paint with nothing loaded is a SKELETON, not an alarm —
//: without this the ladder's honest "I have heard nothing" fires on every load for a moment and
//: teaches the operator that Unknown is normal.
const _bootAt=Date.now();

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>{try{const p=new URL(u,location.origin);return(p.protocol==="http:"||p.protocol==="https:")?u:"#"}catch(e){return"#"}};
// token auth for EVERY call: fetch sends a Bearer header; SSE relies on a same-origin
// cookie (EventSource can't set headers). Set once, works from anywhere with the token.
function setToken(t){localStorage.setItem("openfactory_token",t);
  document.cookie="openfactory_token="+encodeURIComponent(t)+"; path=/; SameSite=Strict; max-age=2592000"}
function authHeaders(){const t=localStorage.getItem("openfactory_token");return t?{"authorization":"Bearer "+t}:{}}
function cookieToken(){const m=document.cookie.match(/(?:^|;\s*)openfactory_token=([^;]*)/);return m?decodeURIComponent(m[1]):""}
// A BROWSER NOBODY HAS IDENTIFIED STILL GETS ITS OWN CONVERSATION with the product role: the
// server keys it by this cookie when the credential names nobody (a shared token, or none), so
// two people on the same deployment stop writing into one thread. Random, a year, never a secret.
function ensureVisitor(){if(/(?:^|;\s*)openfactory_visitor=/.test(document.cookie))return;
  const b=new Uint8Array(16);crypto.getRandomValues(b);
  const id=Array.from(b,x=>x.toString(16).padStart(2,"0")).join("");
  document.cookie="openfactory_visitor="+id+"; path=/; SameSite=Lax; max-age=31536000"}
async function mfetch(u,o){o=o||{};o.headers=Object.assign({},o.headers||{},authHeaders());
  let r=await fetch(u,o);
  if(r.status===401){
    // A DEPLOYMENT WITH A LOGIN PAGE NAMES IT ON THE 401, and the browser goes there: prompting
    // for a token on a deployment that issues none is a door with no handle.
    let d=null;try{d=await r.clone().json()}catch(e){}
    if(d&&d.login){localStorage.removeItem("openfactory_token");
      location.assign(d.login+"?next="+encodeURIComponent(location.pathname+location.search));return r}
    const t=prompt("Panel token — ask the owner for it:");
    if(t){setToken(t);o.headers=Object.assign({},o.headers,authHeaders());r=await fetch(u,o)}}
  return r}
async function api(u,o){const r=await mfetch(u,o);return r.json()}

function since(iso){return iso?Date.now()-new Date(iso).getTime():0}
function fmtDur(ms){if(ms<0)ms=0;const s=Math.floor(ms/1000);
  if(s<60)return s+"s";const m=Math.floor(s/60),ss=s%60;
  if(m<60)return m+"m "+String(ss).padStart(2,"0")+"s";
  const h=Math.floor(m/60);return h+"h "+String(m%60).padStart(2,"0")+"m"}

// routing
function go(path){history.pushState({},"",path);render()}
window.onpopstate=render;
function curProject(){const m=location.pathname.match(/^\/p\/([^/]+)/);return m?decodeURIComponent(m[1]):null}
// THE PRODUCT ROLE'S OWN ADDRESS (#98). A separate path, not a tab on the floor, because it is a
// separate job — the person who writes what the product must do is not the person who watches
// jobs run, and a link to this URL is the whole onboarding for somebody holding a product token.
function curProduct(){const m=location.pathname.match(/^\/product\/([^/]*)/);return m?decodeURIComponent(m[1]):null}

// WHO THIS BROWSER IS HOLDING, and it has to be asked rather than assumed: the credential lives
// in localStorage, not in the HTML, so a page served as a static file cannot know at load time
// whether the person is an operator or a business analyst. Without this the floor boot below
// would fire six reads a product credential is refused, and the screen would fill with 403s —
// which looks exactly like a broken deployment rather than a page meant for somebody else.
let me=null;
function productOnly(){
  // `scopes: null` is UNSCOPED — every ordinary panel token — and is not the same answer as a
  // list that happens to lack "floor". Reading null as "no areas" would hide the panel from
  // every operator who ever held a token.
  return !!(me && Array.isArray(me.scopes) && me.scopes.indexOf("product")>=0
            && me.scopes.indexOf("floor")<0);
}

async function boot(){
  // THE COOKIE WINS WHEN THE SERVER SET IT: a login lands the credential there, and the page
  // copies it into localStorage so every fetch sends it as a Bearer header. On a deployment with
  // no login page the two are one value, written by setToken — so the sync below is unchanged.
  const t=cookieToken()||localStorage.getItem("openfactory_token"); if(t)setToken(t); // sync both, so SSE authenticates
  ensureVisitor(); // this browser's own conversation with the product role, until somebody is known
  paintThemeButton();  // painted before any fetch: a slow API must not leave the switch mislabelled
  me=await api("/api/whoami").catch(()=>null);
  if(productOnly()){ bootProduct(); return; }   // the floor reads below are all 403 for them
  projects=await api("/api/projects").catch(()=>[]);            // 401 here prompts for the token
  if(!Array.isArray(projects))projects=[];
  render();
  // THE FIRST ANSWER, ASKED FOR ONCE (#139). `loadEngine` was only ever on a 20-second interval,
  // so the first 20 seconds of every page load ran on whatever the SSE's opening frame carried —
  // which did not include `intake` or `build`. The header spent that window saying `floor:
  // running` regardless of the poller, on every reload, for everybody. Awaited before the stream
  // opens so the page's first paint is the complete answer rather than a partial one.
  await loadEngine();
  await loadFloor();   // the platform's verdict, before the first paint
  engineStream();                 // live push of the floor (SSE — instant updates)
  // SAFETY-NET POLL: the SSE above gives instant updates, but a panel redeploy (App Runner
  // replaces the service) or a proxy drop can leave the browser's EventSource wedged on its
  // last frame — the "had to F5" bug. A slow one-shot refresh every 20s self-heals the floor
  // even if the socket is dead, so the card can never sit stale indefinitely. Redundant (and
  // harmless) while SSE is healthy; the guaranteed floor when it isn't.
  setInterval(loadEngine,20000);
  setInterval(tickTimers,1000);   // live elapsed timers
  pollBudget(); setInterval(pollBudget,60000);  // the trackers' API budget (why a card might wait)
  pollCoordinator(); setInterval(pollCoordinator,6000);  // the tech-lead's narrated updates → toasts
  loadInbox(); setInterval(loadInbox,15000);  // ZONE A — 'does anything need me?', answered first
  streamConnect();   // pushes what changed; the timers above stay as the floor if it cannot connect
}


// ── the theme ─────────────────────────────────────────────────────────────────────────────────
//
// The <head> script above applies the stored choice before the first paint. This is only the
// switch, and it writes the SAME key — one owner for the value, so the two can never disagree
// about which theme the operator asked for.
function currentTheme(){return document.documentElement.getAttribute("data-theme")==="light"?"light":"dark"}
function paintThemeButton(){
  var el=$("#themeTxt");
  // The label names WHERE THE BUTTON GOES, not where you are. A button reading "dark" while the
  // screen is already dark is the oldest ambiguity in this control; naming the destination is the
  // only version nobody has to think about.
  if(el)el.textContent=currentTheme()==="light"?"dark":"light";
}
function toggleTheme(){
  var next=currentTheme()==="light"?"dark":"light";
  if(next==="light")document.documentElement.setAttribute("data-theme","light");
  else document.documentElement.removeAttribute("data-theme");
  try{localStorage.setItem("of_theme",next)}catch(e){/* private mode: it holds for this session */}
  paintThemeButton();
}

// ── the live stream ───────────────────────────────────────────────────────────────────────────
//
// The agent conversation used to refresh on a 15-second timer. A reply typed by the tech-lead sat
// invisible for up to fifteen seconds while somebody watched the screen — which does not read as
// slow, it reads as broken, and it is the first thing a client sees of a product sold on never
// going quiet.
//
// THE FALLBACK IS THE FEATURE. A socket dies for reasons this code does not control: a proxy that
// will not pass Upgrade, a closed laptop, an idle timeout on the hosting platform. A chat that
// silently stopped receiving is the purest possible violation of this platform's own headline
// invariant, because the screen still looks perfectly healthy. So the polling timers are NEVER
// removed — they are slowed while the socket is healthy and restored the instant it is not — and
// the header says which of the two is happening.
let _ws=null,_wsState="off",_wsTries=0,_wsTimer=null;

// ═══ ONE DELEGATED LISTENER, AND NO VALUE EVER TRAVELS THROUGH JAVASCRIPT IN AN ATTRIBUTE ═══
//
// `onclick="decide('${esc(o.key)}')"` looks safe and is not (#143). `esc()` is correct for element
// TEXT; inside an attribute the HTML parser DECODES the value before the JavaScript in it is
// parsed, so `&#39;` becomes a real quote and the call closes early:
//
//     key = "');alert(document.cookie);//"
//     →  decide('acme','7','');alert(document.cookie);//')
//
// Two statements. The second one runs. And `DecisionOption.key` is an unvalidated string parsed
// out of an AGENT's fenced JSON — influenceable by the text of a ticket on a client's board.
//
// A DATA ATTRIBUTE HAS NO SUCH SEAM: the parser decodes it into a string and `dataset` hands that
// string over. It is never source. The Stop button has done this since #119; these are the rest.
//
// DELEGATED RATHER THAN PER-BUTTON, because every one of these buttons is regenerated inside an
// `innerHTML` on almost every frame — attaching to each would mean re-attaching after each render,
// and the one render somebody forgets is a dead button on a gate a human is waiting at.
const ACTS={
  decide:        d=>decide(d.p,d.i,d.k),
  mergeGate:     d=>mergeGate(d.p,d.i,d.k),
  actJob:        d=>actJob(d.p,d.i,d.k),
  // `resume` WITH a choice — the decision options on a parked job's action strip.
  actJobChoice:  d=>actJob(d.p,d.i,"resume",d.k),
  answerQuestion:d=>answerQuestion(d.p,d.tok,d.k),
  openPromote:   d=>openPromote(d.p,d.i),
  submitPromote: d=>submitPromote(d.p,d.i),
  scanNow:       d=>scanNow(d.p),
  go:            d=>go(d.to),
  acceptRequirement: d=>acceptRequirement(d.n),
  dropRequirement:   d=>dropRequirement(d.n),
  // `approveSuggestion` wants the ELEMENT as well, to disable it while the call is in flight.
  approveSuggestion: (d,el)=>approveSuggestion(el,d.tok),
};
document.addEventListener("click",ev=>{
  const el=ev.target.closest&&ev.target.closest("[data-act]");
  if(!el)return;
  const run=ACTS[el.dataset.act];
  // An unknown verb does NOTHING and says so. Silently ignoring it would make a typo in one of
  // the twenty call sites look like a button the operator failed to press.
  if(!run){console.warn("no handler for data-act",el.dataset.act);return}
  run(el.dataset,el);
});

// AND THE ONE NON-CLICK EVENT. `oninput` had the same seam and the same fix; a separate
// listener rather than a second entry in ACTS, because the two events are not interchangeable
// and a table that pretended they were would dispatch a filter keystroke as a button press.
document.addEventListener("input",ev=>{
  const el=ev.target.closest&&ev.target.closest("[data-oninput]");
  if(!el)return;
  if(el.dataset.oninput==="paintJobLog")paintJobLog(el.dataset.p,el.dataset.i);
});

function streamStatus(state,detail){
  _wsState=state;
  const el=$("#live");if(!el)return;
  // "RECONNECTING", NOT "POLLING" (#134). This pill is about THIS PAGE's socket to the panel —
  // and on a floor screen, beside "floor: running", the word "polling" reads as the factory
  // polling the board, which is a different thing entirely and is exactly how an operator
  // concluded the queue was being pulled while his project's pickup was off.
  const look={live:["ok","live"],polling:["warn","reconnecting"],off:["","…"]}[state]||["",state];
  el.className="pill "+(look[0]?"b-"+look[0]:"");
  el.style.display="";
  el.title=detail||(state==="live"
    ? "changes are pushed as they happen"
    : "the live socket is not available here — falling back to periodic refresh, so updates are "
      +"slower but never stop");
  $("#liveTxt").textContent=look[1];
}

function streamConnect(){
  if(!window.WebSocket){streamStatus("polling","this browser has no WebSocket");return}
  try{if(_ws)_ws.close()}catch(_){}
  const proto=location.protocol==="https:"?"wss:":"ws:";
  // THE SAME CREDENTIAL THE REST OF THE PANEL USES. `authHeaders()` cannot help here — a
  // WebSocket handshake carries no custom headers, which is the same reason the cookie exists
  // for SSE. The query param is what the server's own gate reads.
  const q=new URLSearchParams();
  const tok=localStorage.getItem("openfactory_token");
  if(tok)q.set("token",tok);
  if(_chatProject)q.set("project",_chatProject);
  let sock;
  try{sock=new WebSocket(`${proto}//${location.host}/api/stream?${q}`)}
  catch(e){streamStatus("polling",String(e));return}
  _ws=sock;

  sock.onopen=()=>{_wsTries=0;streamStatus("live")};
  sock.onmessage=ev=>{
    let m;try{m=JSON.parse(ev.data)}catch(_){return}
    if(m.kind==="bye"){streamStatus("polling",m.reason||"the stream ended");return}
    if(m.kind!=="update")return;
    // `null` means the SERVER could not read that section — not that it is empty. Rendering an
    // empty chat there would be a claim about the conversation when the truth is a claim about us.
    if(Array.isArray(m.projects)){projects=m.projects;if(viewOwner()==="index")render()}
    if(m.chat&&m.project===_chatProject)paintChat(m.chat);
  };
  const reopen=()=>{
    if(_ws!==sock)return;             // a newer socket already took over
    streamStatus("polling","reconnecting…");
    _wsTries++;
    // Backed off and CAPPED. An unbounded retry against a proxy that will never pass Upgrade is a
    // browser tab quietly hammering the deployment for the rest of the day.
    const wait=Math.min(30000,1000*Math.pow(2,Math.min(_wsTries,5)));
    clearTimeout(_wsTimer);_wsTimer=setTimeout(streamConnect,wait);
  };
  sock.onclose=reopen;
  sock.onerror=()=>{try{sock.close()}catch(_){}};
}

//: ONE TIMER, RE-DECIDED ON EVERY TICK. The first version returned 15000 or 60000 and was passed
//: to `setInterval` — which evaluates it EXACTLY ONCE, so a socket that died an hour later left
//: the chat on the slow interval forever and the "fallback" was decoration. The interval is now
//: fixed and the DECISION moved inside the tick, where the current state is actually known.
const _CHAT_TICK=15000;
let _chatTicks=0;
function chatShouldFetch(){
  _chatTicks++;
  // Live: a belt-and-braces read every fourth tick (~60s), the same reasoning the engine's 20s
  // refresh already carries — a wedged socket can never leave the panel stale indefinitely.
  // Not live: every tick, which is exactly what it did before the socket existed.
  return _wsState==="live" ? _chatTicks%4===0 : true;
}

function streamWatch(project){
  _chatProject=project;
  if(_ws&&_ws.readyState===1){_ws.send(JSON.stringify({project:project||""}))}
  else streamConnect();
}

// The coordinator NARRATES relevant moments (pickup / merge / deploy); toast what's new since we
// last looked (the first poll just seeds the baseline so we don't replay a backlog on load). The
// SAME feed is what a Slack/PO bot will read — the panel is one channel.
async function pollCoordinator(){
  let msgs; try{msgs=await api("/api/coordinator/messages")}catch(_){return}
  window._coordSeen=window._coordSeen||{}; const first=!window._coordInit;
  for(const m of (msgs||[])){
    const last=window._coordSeen[m.project]||0;
    if((m.id||0)>last){
      if(!first) toast(esc(m.project),esc(m.text),/failure|🔴/.test(m.text||"")?"err":"ok");
      window._coordSeen[m.project]=Math.max(last,m.id||0);
    }
  }
  window._coordInit=true;
}

// The API budget used to be its own pill, shouting even when it was fine. The server composes the
// "pickups paused, refills 14:20" sentence from the same read (`/api/floor`), so this fetch feeds
// only the floor's TOOLTIP — the detail an operator hovers for. FOUR ANSWERS, EACH ITS OWN
// SENTENCE (#141, and the port that replaced `/api/github/ratelimit`): `ok` and `low` carry the
// numbers; `unread` is a probe that FAILED on a vendor that does report one — the poller fails
// open and scans anyway, so it is never rendered as "paused"; `not_reported` is a vendor with no
// budget at all (Jira, Azure Boards), which is a fact about the vendor and not a failure of ours.
// The page compares no number against a threshold: the adapter decided `low` with its own floor
// before the answer left the server.
let _budget={state:"unread"};
async function pollBudget(){
  let r;try{r=await api("/api/budget")}catch(_){_budget={state:"unread"};paintFloor();return}
  _budget=(r&&r.summary&&r.summary.state)?r.summary:{state:"unread"};
  paintFloor();
}
function budgetLine(b){
  if(!b)return "";
  const who=b.vendor||b.kind||"API", pool=b.resource?` ${b.resource}`:"";
  if(b.state==="not_reported")return "no API budget on this vendor";
  if(b.state==="unread")return `${who}${pool} budget could not be read — the poller scans without that safety net`;
  const share=(b.limit?`${b.remaining}/${b.limit}`:String(b.remaining));
  if(b.state==="low")return `${who}${pool} budget spent (${share}${b.reset_at?`, refills ${b.reset_at}`:""})`;
  if(b.state==="ok")return `${who}${pool} budget ${share}`;
  return "";
}

// --- durable engine state, pushed over SSE ---------------------------------
//
// A FRAME IS MERGED, NEVER SUBSTITUTED (#139). `engine = JSON.parse(...)` replaced the whole
// object, and the stream did not carry `intake` or `build` — so every frame silently deleted the
// two facts the header is MADE of, and only the 20-second safety-net poll put them back.
//
// Measured on the pilot: for the first 20 seconds after every reload the header said
// `floor: running` whatever the poller was actually doing, and the build-split banner could not
// appear at all. The operator read that screen and said he could not understand any of it. He was
// right: it was stating a fact it had, at that instant, no way to know.
//
// The server carries both now. This merge is the SECOND line of defence: a payload that omits a
// key leaves the previous answer standing rather than erasing it — which is also what makes the
// page survive an older worker that has not been rebuilt yet.
//
// AN ALLOWLIST, NOT A BLANKET MERGE. `{...was, ...f}` would carry EVERY key forward, so a key
// added to the polled endpoint and forgotten on the stream would persist for ever without anybody
// deciding that it should — a fact inherited by accident is the defect this file is about, wearing
// the opposite sign. Here the frame is authoritative by default and exactly these four keys
// survive their own absence, each because it is expensive to read and slow to change.
//
// `error` is deliberately NOT among them: it is present only on the disconnected frame, and
// inheriting it pins the first blip's message on screen under a header that has long gone healthy.
const ENGINE_KEPT_IF_ABSENT=["intake","build","address","ui_base"];

function applyEngineFrame(f){
  if(!f||typeof f!=="object")return;
  const was=engine||{};
  const next={...f};
  for(const k of ENGINE_KEPT_IF_ABSENT) if(!(k in f) && (k in was)) next[k]=was[k];
  // `jobs` is authoritative on every frame INCLUDING the disconnected one, where `[]` means "I
  // cannot see any" — that is the frame's answer, not an omission, so it is never inherited.
  next.jobs=Array.isArray(f.jobs)?f.jobs:[];
  engine=next;
  _engineAt=Date.now();
}

function engineStream(){
  if(engineES)engineES.close();
  engineES=new EventSource("/api/temporal/stream");
  engineES.onmessage=e=>{
    // PARSE inside the try, PAINT outside it. `applyEngine()` used to sit in here, so any
    // exception a painter threw was swallowed by the same `catch` — the panel froze on its last
    // frame with nothing in the console, no toast and no banner, which looks exactly like a
    // quiet factory. A broken painter must be loud.
    let f; try{f=JSON.parse(e.data)}catch(_){return} // eslint-disable-line
    applyEngineFrame(f);
    applyEngine();
  };
  // the browser auto-reconnects an SSE stream on error — nothing to do
}
async function loadEngine(){ // one-shot refresh (after a manual action), then SSE takes over
  // A FAILED FETCH IS THIS PAGE'S FAILURE, not a statement about the engine. Synthesising
  // `{connected:false}` here made the panel announce "engine unreachable" — a claim about
  // Temporal — when what had actually happened was that the browser could not reach the panel.
  let f=null; try{f=await api("/api/temporal/jobs")}catch(e){_engineErr=String(e&&e.message||e)}
  if(f){_engineErr="";applyEngineFrame(f)}
  applyEngine();
}
// ═══ THE FLOOR'S ONE ANSWER — ASKED, NOT COMPUTED ════════════════════════════════════════════
//
// This page used to compute the answer itself: a nine-rung ladder, 360 lines, in JavaScript. That
// was already the second version — the first was FIVE computations that contradicted each other on
// screen (#141). Collapsing five into one fixed the screen and left the capability inside the
// screen, which is the same defect one level up: a Slack bot asked "is the factory working?" would
// have re-implemented nine rungs, and the two would have drifted exactly as the five did.
//
// The ladder lives in `openfactory/floor/` now and answers over `/api/floor`. This page renders.
//
// EXCEPT FOR ONE THING, WHICH IS A RULE AND NOT AN OMISSION: **the server answers about the
// FACTORY; only the browser can answer about the BROWSER.** "This page has heard nothing for three
// minutes" is a fact about a socket in this tab. The server does not know it, and a server that
// asserted it would be inventing — so that stays here, wrapped around everything the server said.
let _floor=null,_floorAt=0,_floorErr="";
const FS_STALE_MS=45000;

async function loadFloor(){
  const scope=curProject()||"";
  let got=null;
  try{got=await api("/api/floor"+(scope?"/"+encodeURIComponent(scope):""))}
  catch(e){_floorErr=String(e&&e.message||e)}
  if(got&&got.word){_floorErr="";_floor=got;_floorAt=Date.now()}
  paintFloor();
}

// RUNG 2, AND ONLY RUNG 2. Everything below is the platform's verdict, rendered; this decides
// whether this page is in a position to repeat it.
function floorNow(){
  const now=Date.now();
  if(!_floorAt&&!_floorErr&&now-_bootAt<3000)
    return {word:"",short:"",level:"ok",rung:0,cause:"loading",clause:"reading the floor…",
            line:"reading the floor…",detail:"",cmd:"",meta:"",actions:[],also:[],also_more:0,
            census_line:"",loading:true};
  if(_floorErr||!_floor)
    return {word:"Unknown",short:"Unknown",level:"unknown",rung:2,cause:"page_blind",
            clause:"this page could not reach its own API — nothing here is current",
            line:"Unknown — this page could not reach its own API — nothing here is current",
            detail:_floorErr,cmd:"",meta:"",actions:[{key:"reload",label:"Reload",tone:"ghost"}],
            also:[],also_more:0,census_line:"",loading:false};
  const age=now-_floorAt;
  if(age>FS_STALE_MS)
    return Object.assign({},_floor,{word:"Unknown",short:"Unknown",level:"unknown",rung:2,
      cause:"page_blind",
      clause:`this page has heard nothing for ${fsDur(age)} — what is below is that old`,
      line:`Unknown — this page has heard nothing for ${fsDur(age)} — what is below is that old`,
      // The platform's last answer is kept as the DETAIL rather than dropped: "here is what I was
      // told, and how long ago" is more useful than a blank, and it cannot be mistaken for current
      // because the word above it says so.
      detail:`the last answer said: ${_floor.line}`,
      actions:[{key:"reload",label:"Reload",tone:"ghost"}]});
  return _floor;
}

function fsDur(ms){
  const s=Math.max(0,Math.round(ms/1000));
  return s<90?`${s}s`:s<5400?`${Math.round(s/60)} min`:`${(s/3600).toFixed(1)}h`;
}

function paintFloor(){
  const el=$("#floor");if(!el)return;
  const fs=floorNow();
  // NOTHING SHOUTS WHEN IT IS FINE: the level names which CSS treatment applies. `lvl-ok` has no
  // banner rule at all — healthy is a flat surface, not a green one — while `lvl-warn`/`lvl-err`
  // wash the WHOLE banner, so a degraded floor is a different surface rather than a recoloured
  // word. `lvl-clock` is flat too: a machine-owned wait is not a problem.
  el.className="statusbar lvl-"+fs.level;
  // THE TOOLTIP NO LONGER ASSERTS FOUR THINGS IT DID NOT CHECK. It used to read "engine
  // reachable, poller running, no project held, GitHub budget healthy" on every ok — a sentence
  // that was simply printed, never derived. It now carries what the ladder actually found.
  // …plus the budget the trackers reported, in whichever of its four states it is in — the one
  // read the ladder only speaks about when it is `low`, hover-visible in every state.
  el.title=[fs.detail,fs.meta,budgetLine(_budget)].filter(Boolean).join(" — ")||fs.clause;
  const line=fs.loading?"reading the floor…":fs.line;
  // A REMEDIATION COMMAND arrives backtick-quoted from `gate_reason` (server text) — escape the
  // WHOLE sentence first, then wrap the backticked span, so nothing in it can inject markup.
  let html=esc(line).replace(/`([^`]+)`/g,'<span class="cmd">$1</span>');
  if(fs.cmd) html+=` <span class="cmd">${esc(fs.cmd)}</span>`;
  if(fs.censusLine) html+=` <span class="sub" style="font-weight:500">${esc(fs.censusLine)}</span>`;
  $("#floorTxt").innerHTML=html;
  paintAlso(fs);
}
//: The causes the headline demoted. Shown because the old header named ONE held project and never
//: mentioned that two others were held too — a summary that hides its own remainder.
function paintAlso(fs){
  const el=$("#floorAlso"); if(!el)return;
  if(!fs.also.length){el.style.display="none";el.innerHTML="";return}
  el.style.display="";
  el.innerHTML=fs.also.map(c=>`<span class="alsorow lvl-${esc(c.level)}">Also — ${esc(c.clause)}`
    +(c.cmd?` <span class="cmd">${esc(c.cmd)}</span>`:"")+"</span>").join("")
    +(fs.alsoMore?`<span class="alsorow"><b>+${fs.alsoMore} more</b> — open Projects</span>`:"");
}
// THE PAGE YOU ARE READING MAY NOT BE THE FACTORY YOU ARE RUNNING (#135).
//
// Both containers BAKE the package, so `up -d --build worker` leaves this page served by whatever
// image it was last built from. On 2026-08-17 the pilot rebuilt, pressed F5, and read a page from an
// image twenty-eight hours older — reporting the older world, offering the older buttons, with
// nothing on screen able to say so. He spent the round believing the fix had not worked.
//
// Said ONLY when the two halves are PROVEN to differ (`agree===false`). `null` means it could not be
// established — a checkout, or a worker too old to announce — and a banner on a working stack is how
// operators learn to scroll past banners.
function paintBuildSplit(){
  const el=$("#buildsplit"); if(!el)return;
  const b=engine.build||{};
  if(b.agree!==false){el.style.display="none";return}
  const when=t=>t?`, built ${esc(t)}`:"";
  // BY ROLE, NAMED — not "the worker". Whichever half you did not rebuild is the stale one, so the
  // page must be able to name a half it was not written knowing about.
  const others=Object.entries(b.others||{})
    .filter(([r,o])=>o.stamp&&o.stamp!==b.stamp)
    .map(([r,o])=>`the <b>${esc(r)}</b> runs <code>${esc(o.stamp)}</code>${when(o.built_at)}`);
  el.style.display="";
  el.innerHTML=`<b>This deployment is running more than one build.</b> The page you are reading was `
    +`served by <code>${esc(b.stamp||"?")}</code>${when(b.built_at)}; ${others.join("; ")}. Whatever `
    +`you are looking at may be the older half, so treat every statement on this screen as suspect. `
    +`Rebuild ALL of them — <code>docker compose --env-file .env.compose up -d --build</code>, with `
    +`no service name after it — then reload.`;
}

function applyEngine(){
  // THE VERDICT IS THE PLATFORM'S, so a frame does not recompute it — it asks again. Cheap: the
  // route's slow reads are cached server-side (`_STREAM_SLOW_S`) and the costly one for a minute,
  // so this is a job-list read plus arithmetic, which is what the frame already cost.
  loadFloor();
  syncDecisions();
  paintBuildSplit();  // before anything else reads this page: it may not be the page it thinks
  paintFloor();  // the status bar belongs to every page — it is a header, not a view
  // update the current view WITHOUT tearing down an open log feed, and WITHOUT painting the
  // floor over a page that is not the floor (see `viewOwner`).
  const owner=viewOwner();
  if(owner==="project")refreshProject();
  else if(owner==="index")renderIndex();
}

// --- decisions the tech-lead surfaced: a prominent modal + a header pill (one CHANNEL of the
// pluggable decision events; a Slack/PO bot reads the same GET /api/inbox) ------------------
function pendingDecisions(){
  return engine.jobs.filter(j=>j.action&&j.action.decision&&j.action.decision.options
                              &&j.action.decision.options.length);
}
function syncDecisions(){
  const items=pendingDecisions(), pill=$("#decpill");
  if(pill){pill.style.display=items.length?"flex":"none";
    $("#decpillTxt").textContent=`${items.length} decision${items.length>1?"s":""} needed`}
  // auto-open the modal ONCE when a NEW decision appears (don't re-nag a dismissed one)
  const key=items.length?`${items[0].project}#${items[0].issue}:${items[0].action.decision.question}`:"";
  if(key && key!==window._decShown){window._decShown=key; openDecisionModal()}
  // if the modal is open, re-render so the tech-lead's advice appears LIVE when it lands
  else if(items.length && $("#modal").dataset.kind=="decision") openDecisionModal();
  if(!items.length && $("#modal").dataset.kind=="decision") closeModal();
}
function openDecisionModal(){
  const items=pendingDecisions(); if(!items.length)return;
  const j=items[0], d=j.action.decision;
  const opts=d.options.map(o=>
    `<button class="btn${o.recommended?"":" ghost"}" style="text-align:left;width:100%;margin-top:8px" data-act="decide" data-p="${esc(j.project)}" data-i="${esc(j.issue)}" data-k="${esc(o.key)}">
       <b>${esc(o.key)} · ${esc(o.label)}</b>${o.recommended?' <span class="badge b-ok" style="margin-left:6px">recommended</span>':""}
       ${o.consequence?`<div class="sub" style="margin-top:2px">${esc(o.consequence)}</div>`:""}</button>`).join("");
  const more=items.length>1?`<div class="sub" style="margin-top:12px">+${items.length-1} more decision${items.length>2?"s":""} waiting</div>`:"";
  // the tech-lead coordinator's humanized take, if it has weighed in yet
  const adv=d.advice&&(d.advice.summary||d.advice.recommend)?
    `<div style="margin:8px 0;padding:10px;border-radius:8px;background:color-mix(in srgb,var(--cyan) 10%,transparent);border:1px solid color-mix(in srgb,var(--cyan) 28%,transparent)">
       <b>Tech-lead</b> — ${esc(d.advice.summary||"")}
       ${d.advice.recommend?`<div style="margin-top:4px"><b>Recommends: ${esc(d.advice.recommend)}</b> — ${esc(d.advice.rationale||"")}</div>`:""}
       ${d.advice.watch_outs?`<div class="sub" style="margin-top:4px">⚠️ ${esc(d.advice.watch_outs)}</div>`:""}</div>`
    :`<div class="sub" style="margin:8px 0">the tech-lead is reviewing this…</div>`;
  modal(`<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div><b style="font-size:16px">Decision needed</b>
      <div class="sub">${esc(j.project)} <span class="mono">#${esc(j.issue)}</span> · tech-lead (${esc(d.stage||"")})</div></div></div>
    <div style="font-size:15px;font-weight:600;margin:10px 0 4px">${esc(d.question||"Choose how to proceed")}</div>
    ${d.context?`<div class="sub" style="margin-bottom:6px">${esc(d.context)}</div>`:""}
    ${adv}${opts}${more}
    <div style="margin-top:14px;text-align:right"><button class="btn ghost sm" onclick="closeModal()">Later</button></div>`);
  $("#modal").dataset.kind="decision";
}
async function decide(project,issue,key){
  closeModal();
  await actJob(project,issue,"resume",key);  // the factory acts on the choice (same API a bot uses)
}
// domain-state badge class (merged vs needs-refinement etc. — the raw status can't tell)
function domBadge(s){if(SHIPPED_BADGE.has(s))return"b-ok";
  // AN OPEN PR IS AMBER, not green: it is waiting for a person, and green is the colour this
  // page uses for "done". It sat in the terminal-good list with `merged`.
  if(s=="pr_open")return"b-run";
  if(ALARM.has(s)||s=="failed")return"b-err";
  if(["paused","awaiting_prod_approval","running"].includes(s))return"b-run";return"b-dim"}
// the ticket's title, shown next to its #number so a job reads as "#123 Add health check"
// (stamped into the workflow memo by the engine; '' for older jobs → just the number shows).
function tkTitle(j){return j&&j.title?` <span style="color:var(--muted);font-weight:500">${esc(j.title)}</span>`:""}
// post-merge deploy-watch outcome (ADR-0005), shown as a chip so the deploy is visible in the
// panel (the watch only notifies otherwise). Empty when the job has no watch / hasn't merged.
const _DEPLOY_CHIP={
  deploying:["deploying…","b-run"], deployed:["deployed","b-ok"],
  deploy_failed:["deploy failed","b-err"], deploy_timeout:["deploy timeout","b-err"]};
function deployChip(j){const c=j&&j.deploy&&_DEPLOY_CHIP[j.deploy];
  return c?` <span class="badge ${c[1]}" title="post-merge dev deploy (ADR-0005)">${c[0]}</span>`:""}
// ── ZONE A — 'does anything need me?', answered FIRST and on the page, never behind a click.
// Fed by GET /api/inbox, which already returns exactly this: one row per job waiting on a human,
// each self-describing its `kind`, its question, and its executable `options` — the platform's
// own invariant made visible (a wait is a question, never a state — ADR-0038 D2). This supersedes
// the old `openAttention` modal, which showed the same jobs but only after a click found them.
let inbox=null;
async function loadInbox(){
  let d; try{d=await api("/api/inbox")}catch(e){d=null}
